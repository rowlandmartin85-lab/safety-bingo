<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety Bingo Question Manager</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#0b1b3a,#050914);
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:40px;
}

.manager{
width:100%;
max-width:950px;
background:rgba(17,24,39,.92);
border:2px solid rgba(255,255,255,.15);
border-radius:20px;
padding:35px;
box-shadow:0 20px 45px rgba(0,0,0,.55);
}

h1{
font-size:52px;
font-weight:900;
margin-bottom:35px;
text-align:center;
text-transform:uppercase;
letter-spacing:2px;
line-height:1.1;
color:#FFD700;
}

h2{
color:#FFD700;
margin-bottom:15px;
font-size:28px;
}

input{
width:100%;
padding:16px;
margin-bottom:18px;
font-size:18px;
border-radius:12px;
border:2px solid #374151;
background:#111827;
color:white;
}

input:focus{
outline:none;
border-color:#60a5fa;
}

select{
width:100%;
height:350px;
padding:12px;
font-size:16px;
border-radius:12px;
border:2px solid #374151;
background:#111827;
color:white;
margin-bottom:20px;
}

option{padding:8px}

button{
padding:14px 28px;
margin:5px;
font-size:18px;
font-weight:900;
text-transform:uppercase;
letter-spacing:1px;
border-radius:10px;
cursor:pointer;
color:white;
border:2px solid rgba(255,255,255,.35);
background:linear-gradient(145deg,#60a5fa,#2563eb,#1e3a8a);
box-shadow:
inset 0 3px 5px rgba(255,255,255,.5),
inset 0 -5px 8px rgba(0,0,0,.5),
0 6px 12px rgba(0,0,0,.6);
}

button:hover{
transform:translateY(-3px);
filter:brightness(1.15);
}

#addQuestionBtn{
background:linear-gradient(145deg,#fff3a1,#ffd700,#b8860b);
color:#111827;
}

#removeQuestionBtn,
#removeSelectedBtn,
#deleteAllBtn{
background:linear-gradient(145deg,#ff6b6b,#dc2626,#7f1d1d);
}

#questionCount{
margin-top:20px;
color:#22c55e;
font-size:20px;
font-weight:bold;
}

hr{
border:none;
border-top:2px solid rgba(255,255,255,.15);
margin:35px 0;
}

@media(max-width:700px){
body{padding:20px}
.manager{padding:20px}
h1{font-size:34px}
button{width:100%}
}
</style>

</head>

<body>

<div class="manager">

<h1>
Safety Bingo<br>
Question Manager
</h1>

<section>

<h2>Add New Question</h2>

<input id="newQuestion" type="text" placeholder="Enter question">

<input id="newAnswer" type="text" placeholder="Enter answer">

<button id="addQuestionBtn">
Add Question
</button>

</section>

<hr>

<section>

<h2>Remove Question</h2>

<select id="questionList" size="15" multiple>
<option>Loading questions...</option>
</select>

<br>

<button id="removeQuestionBtn">
Remove Question
</button>

<button id="removeSelectedBtn">
Delete Selected Questions
</button>

<button id="deleteAllBtn">
Delete All Questions
</button>

<p id="questionCount">
Questions Loaded: 0
</p>

</section>

</div>

<script src="/js/questionManager.js"></script>

</body>
</html>
