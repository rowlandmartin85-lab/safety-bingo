<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Safety Bingo Question Manager
</title>

</head>


<body>


<h1>
Safety Bingo Question Manager
</h1>


<section>

<h2>
Add New Question
</h2>


<input
id="newQuestion"
type="text"
placeholder="Enter question">


<input
id="newAnswer"
type="text"
placeholder="Enter answer">


<button
id="addQuestionBtn">

ADD QUESTION

</button>


</section>




<hr>




<section>

<h2>
Remove Question
</h2>


<select
id="questionList">

<option>
Loading questions...
</option>

</select>


<button
id="removeQuestionBtn">

REMOVE QUESTION

</button>


</section>

<script src="/js/questionManager.js"></script>


</body>

</body>

</html>
