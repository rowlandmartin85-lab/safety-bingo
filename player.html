<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety Bingo Player</title>
<link rel="stylesheet" href="/css/style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#0b1b3a,#050914);
color:white;
display:flex;
justify-content:center;
align-items:flex-start;
padding:12px;
}

.player-container{
width:100%;
max-width:760px;
background:rgba(17,24,39,.95);
border:2px solid rgba(255,255,255,.15);
border-radius:18px;
padding:20px;
box-shadow:0 15px 35px rgba(0,0,0,.6);
text-align:center;
}

h1{
display:block;
width:100%;
font-family:Arial,Helvetica,sans-serif;
font-size:clamp(25px,4.5vw,38px);
font-weight:900;
line-height:1;
margin:0 0 22px;
padding:0;
text-transform:uppercase;
letter-spacing:.8px;
white-space:nowrap;
overflow:hidden;
color:#ffd700;
background:linear-gradient(135deg,#fff3a1,#ffd700,#cca100,#ffd700,#fff3a1);
background-size:200% auto;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
animation:goldShine 6s linear infinite;
filter:
drop-shadow(0 1px 0 #b39200)
drop-shadow(0 2px 0 #806800)
drop-shadow(0 3px 4px rgba(0,0,0,.6));
}

@keyframes goldShine{
0%{
background-position:0% center;
}
100%{
background-position:200% center;
}
}

.controls{
display:flex;
gap:10px;
justify-content:center;
align-items:center;
flex-wrap:wrap;
}

input{
padding:11px 14px;
font-size:15px;
font-weight:bold;
color:white;
background:linear-gradient(145deg,#1f2937,#111827);
border:2px solid rgba(255,255,255,.25);
border-radius:10px;
outline:none;
box-shadow:
inset 0 3px 6px rgba(0,0,0,.6),
0 4px 8px rgba(0,0,0,.5);
width:210px;
height:46px;
text-align:center;
}

input:focus{
border-color:#ffd700;
box-shadow:0 0 10px rgba(255,215,0,.5);
}

button{
padding:11px 18px;
min-width:130px;
font-size:15px;
font-weight:bold;
text-transform:uppercase;
letter-spacing:.7px;
border-radius:11px;
cursor:pointer;
color:white;
border:2px solid rgba(255,255,255,.25);
box-shadow:
inset 0 2px 4px rgba(255,255,255,.35),
inset 0 -4px 7px rgba(0,0,0,.5),
0 6px 12px rgba(0,0,0,.6);
text-shadow:0 -1px 2px rgba(0,0,0,.8);
transition:
transform .15s ease,
box-shadow .15s ease,
filter .15s ease;
}

button:hover{
transform:translateY(-2px) scale(1.02);
filter:brightness(1.15);
box-shadow:
inset 0 2px 5px rgba(255,255,255,.45),
inset 0 -5px 8px rgba(0,0,0,.4),
0 9px 16px rgba(0,0,0,.7);
}

button:active{
transform:translateY(1px) scale(.98);
}

#loadCardBtn{
background:linear-gradient(145deg,#60a5fa,#2563eb,#1e3a8a);
border-color:#93c5fd;
}

#homeBtn{
position:fixed;
top:10px;
left:10px;
z-index:9999;
min-width:auto;
padding:8px 12px;
font-size:12px;
border-radius:9px;
background:linear-gradient(145deg,#f87171,#dc2626,#7f1d1d);
border-color:#fca5a5;
}

#gameState{
margin:18px auto;
padding:12px 15px;
max-width:650px;
min-height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:linear-gradient(145deg,#374151,#111827);
color:#ffd700;
font-size:clamp(15px,2.5vw,21px);
font-weight:bold;
line-height:1.2;
box-shadow:
inset 0 2px 5px rgba(255,255,255,.15),
0 5px 10px rgba(0,0,0,.5);
}

#gameArea{
display:block;
width:100%;
}

#cardArea{
width:100%;
max-width:690px;
margin:20px auto 0;
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:7px;
padding:7px;
background:rgba(5,9,20,.7);
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
box-shadow:
inset 0 2px 8px rgba(0,0,0,.6),
0 8px 18px rgba(0,0,0,.45);
}

.bingo-cell{
width:100%;
aspect-ratio:1;
min-width:0;
min-height:0;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:6px;
background:linear-gradient(145deg,#263244,#182130);
border-radius:8px;
border:1.5px solid #526176;
font-family:Arial,Helvetica,sans-serif;
font-size:14px;
font-weight:800;
line-height:1.05;
letter-spacing:.05px;
color:#fff;
cursor:pointer;
transition:
transform .15s ease,
filter .15s ease,
background .15s ease;
user-select:none;
overflow:hidden;
overflow-wrap:normal;
word-break:normal;
hyphens:none;
white-space:normal;
}

.bingo-cell:hover{
transform:scale(1.025);
filter:brightness(1.12);
}

.bingo-cell.cell-single-line{
white-space:nowrap;
}

.bingo-cell.cell-two-line{
white-space:normal;
}

.cell-marked{
background:linear-gradient(145deg,#22c55e,#15803d);
border-color:#86efac;
color:white;
box-shadow:
inset 0 2px 5px rgba(255,255,255,.18),
0 3px 8px rgba(0,0,0,.4);
}

.free-space{
background:linear-gradient(145deg,#fff3a1,#ffd700,#b8860b);
border-color:#ffe066;
color:#111827;
}

.message-box{
margin-top:15px;
padding:12px;
border-radius:10px;
background:#111827;
border:2px solid rgba(255,255,255,.15);
font-size:16px;
}

.loading{
color:#60a5fa;
font-weight:bold;
}

.success{
color:#22c55e;
font-weight:bold;
}

.error{
color:#ef4444;
font-weight:bold;
}

@media(max-width:700px){

body{
padding:10px;
}

.player-container{
padding:15px;
border-radius:15px;
}

h1{
font-size:clamp(21px,6vw,30px);
margin-bottom:18px;
}

.controls{
gap:8px;
}

input{
width:190px;
height:42px;
font-size:14px;
}

#loadCardBtn{
height:42px;
padding:9px 14px;
font-size:13px;
}

#gameState{
margin:14px auto;
padding:10px;
font-size:clamp(13px,3.8vw,18px);
}

#cardArea{
margin-top:15px;
gap:5px;
padding:5px;
border-radius:11px;
}

.bingo-cell{
padding:4px;
font-size:clamp(8px,2.5vw,12px);
border-radius:6px;
line-height:1.03;
}

#homeBtn{
top:8px;
left:8px;
padding:7px 10px;
font-size:11px;
}
}

@media(max-width:450px){

.player-container{
padding:12px;
}

h1{
font-size:clamp(19px,6vw,25px);
}

#cardArea{
gap:4px;
padding:4px;
}

.bingo-cell{
padding:3px;
font-size:clamp(7px,2.7vw,10px);
border-width:1px;
}
}

@media(min-width:701px){

.bingo-cell{
font-size:clamp(10px,1.45vw,14px);
}
}
</style>
</head>

<body>

<button id="homeBtn" type="button">HOME</button>

<div class="player-container">

<h1>SAFETY STANDDOWN BINGO</h1>

<div class="controls">

<input
id="cardInput"
type="number"
placeholder="Enter Card ID">

<button
id="loadCardBtn"
type="button">
LOAD CARD
</button>

</div>

<div id="gameArea">

<div id="gameState">
Waiting for host...
</div>

<div id="cardArea"></div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/cardGenerator.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/player.js"></script>

<script>
functionfitBingoText(){
constcells=document.querySelectorAll(".bingo-cell");
cells.forEach(cell=>{
cell.classList.remove("cell-single-line","cell-two-line");
consttext=cell.textContent.trim();
if(!text)return;
cell.style.fontSize="";
cell.style.whiteSpace="nowrap";
constmaxSize=14;
constminSize=7;
cell.style.fontSize=maxSize+"px";
while(cell.scrollWidth>cell.clientWidth&&parseFloat(cell.style.fontSize)>minSize){
cell.style.fontSize=(parseFloat(cell.style.fontSize)-.25)+"px";
}
if(cell.scrollWidth<=cell.clientWidth){
cell.classList.add("cell-single-line");
return;
}
cell.style.whiteSpace="normal";
cell.classList.add("cell-two-line");
cell.style.fontSize=Math.max(minSize,parseFloat(cell.style.fontSize))+"px";
});
}

constcardArea=document.getElementById("cardArea");

if(cardArea){
constobserver=newMutationObserver(()=>{
requestAnimationFrame(fitBingoText);
});
observer.observe(cardArea,{childList:true,subtree:true});
}

window.addEventListener("resize",fitBingoText);

document.addEventListener("DOMContentLoaded",()=>{
setTimeout(fitBingoText,100);
setTimeout(fitBingoText,500);
});

document.getElementById("homeBtn").addEventListener("click",function(){
window.location.href="/index.html";
});
</script>

</body>
</html>
