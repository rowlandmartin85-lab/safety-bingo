```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety Bingo Player</title>
<link rel="stylesheet" href="/css/style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
min-height:100vh;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#0b1b3a,#050914);
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:auto;
}

.player-container{
width:100%;
max-width:700px;
background:rgba(17,24,39,.95);
border:2px solid rgba(255,255,255,.15);
border-radius:16px;
padding:20px;
box-shadow:0 15px 35px rgba(0,0,0,.6);
text-align:center;
}

/* DISPLAY-STYLE TITLE */

h1{
display:block;
width:100%;
font-family:Arial,Helvetica,sans-serif;
font-size:34px;
font-weight:900;
line-height:1;
margin:0 0 22px;
padding:0;
text-transform:uppercase;
letter-spacing:1px;
white-space:nowrap;
overflow:hidden;
text-overflow:clip;
color:#ffd700;
background:linear-gradient(135deg,#fff3a1,#ffd700,#cca100,#ffd700,#fff3a1);
background-size:200% auto;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
animation:goldShine 6s linear infinite;
filter:
drop-shadow(0 1px 0 #b39200)
drop-shadow(0 2px 0 #997d00)
drop-shadow(0 3px 0 #806800)
drop-shadow(0 4px 5px rgba(0,0,0,.6));
}

@keyframes goldShine{
0%{
background-position:0% center;
}
100%{
background-position:200% center;
}
}

/* CONTROLS */

.controls{
display:flex;
gap:10px;
justify-content:center;
align-items:center;
flex-wrap:wrap;
}

input{
padding:10px 14px;
font-size:15px;
font-weight:bold;
color:white;
background:linear-gradient(145deg,#1f2937,#111827);
border:2px solid rgba(255,255,255,.25);
border-radius:10px;
outline:none;
box-shadow:
inset 0 3px 6px rgba(0,0,0,.6),
0 4px 8px rgba(0,0,0,.5);
width:190px;
height:46px;
text-align:center;
}

input:focus{
border-color:#ffd700;
box-shadow:0 0 10px rgba(255,215,0,.5);
}

/* BUTTONS */

button{
padding:10px 18px;
min-width:125px;
font-size:15px;
font-weight:bold;
text-transform:uppercase;
letter-spacing:.7px;
border-radius:11px;
cursor:pointer;
color:white;
border:2px solid rgba(255,255,255,.25);
box-shadow:
inset 0 2px 4px rgba(255,255,255,.35),
inset 0 -4px 7px rgba(0,0,0,.5),
0 6px 12px rgba(0,0,0,.6);
text-shadow:0 -1px 2px rgba(0,0,0,.8);
transition:
transform .15s ease,
box-shadow .15s ease,
filter .15s ease;
}

button:hover{
transform:translateY(-2px) scale(1.02);
filter:brightness(1.15);
box-shadow:
inset 0 2px 5px rgba(255,255,255,.45),
inset 0 -5px 8px rgba(0,0,0,.4),
0 9px 16px rgba(0,0,0,.7);
}

button:active{
transform:translateY(1px) scale(.98);
box-shadow:
inset 0 4px 8px rgba(0,0,0,.7),
0 2px 5px rgba(0,0,0,.5);
}

/* LOAD CARD */

#loadCardBtn{
background:linear-gradient(145deg,#60a5fa,#2563eb,#1e3a8a);
border-color:#93c5fd;
}

/* HOME */

#homeBtn{
position:fixed;
top:12px;
left:12px;
z-index:9999;
min-width:auto;
padding:8px 13px;
font-size:12px;
border-radius:9px;
background:linear-gradient(145deg,#f87171,#dc2626,#7f1d1d);
border-color:#fca5a5;
}

/* GAME STATE */

#gameState{
margin:18px auto;
padding:14px;
max-width:560px;
min-height:44px;
border-radius:12px;
background:linear-gradient(145deg,#374151,#111827);
color:#ffd700;
font-size:19px;
font-weight:bold;
box-shadow:
inset 0 2px 5px rgba(255,255,255,.15),
0 5px 10px rgba(0,0,0,.5);
}

/* BINGO CARD */

#cardArea{
margin:20px auto 0;
width:100%;
max-width:560px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px;
}

.bingo-cell{
aspect-ratio:1;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:7px;
background:#1f2937;
border-radius:8px;
border:2px solid #4b5563;
font-size:13px;
font-weight:bold;
cursor:pointer;
transition:.2s ease;
user-select:none;
}

.bingo-cell:hover{
transform:scale(1.04);
filter:brightness(1.15);
}

.cell-marked{
background:linear-gradient(145deg,#22c55e,#15803d);
border-color:#86efac;
color:white;
}

.free-space{
background:linear-gradient(145deg,#fff3a1,#ffd700,#b8860b);
border-color:#ffe066;
color:#111827;
}

#gameArea{
display:block;
}

.message-box{
margin-top:15px;
padding:12px;
border-radius:10px;
background:#111827;
border:2px solid rgba(255,255,255,.15);
font-size:16px;
}

.loading{
color:#60a5fa;
font-weight:bold;
}

.success{
color:#22c55e;
font-weight:bold;
}

.error{
color:#ef4444;
font-weight:bold;
}

/* MOBILE */

@media(max-width:700px){

body{
padding:10px;
align-items:center;
}

.player-container{
max-width:500px;
padding:15px;
}

h1{
font-size:26px;
letter-spacing:.5px;
margin-bottom:18px;
}

.controls{
gap:8px;
}

#cardArea{
max-width:100%;
gap:5px;
}

.bingo-cell{
font-size:11px;
padding:4px;
border-radius:7px;
}

#gameState{
font-size:16px;
padding:12px;
margin:15px auto;
}

input,
#loadCardBtn{
width:100%;
max-width:280px;
}

#homeBtn{
width:auto;
max-width:none;
}
}

@media(max-width:400px){

.player-container{
padding:12px;
}

h1{
font-size:22px;
}

.bingo-cell{
font-size:9px;
padding:3px;
}

#cardArea{
gap:4px;
}

}
</style>

</head>

<body>

<button id="homeBtn" type="button">HOME</button>

<div class="player-container">

<h1>SAFETY STANDDOWN BINGO</h1>

<div class="controls">

<input
id="cardInput"
type="number"
placeholder="Enter Card ID">

<button
id="loadCardBtn"
type="button">
LOAD CARD
</button>

</div>

<div id="gameArea">

<div id="gameState">
Waiting for host...
</div>

<div id="cardArea"></div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/cardGenerator.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/player.js"></script>

<script>
document.getElementById("homeBtn").addEventListener("click",function(){
window.location.href="/index.html";
});
</script>

</body>
</html>
```
