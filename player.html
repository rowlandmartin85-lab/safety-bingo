<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Safety Bingo Player</title>

<link rel="stylesheet" href="/css/style.css">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   PAGE
===================================================== */

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #0b1b3a,
            #050914
        );

    color:white;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:20px;
}


/* =====================================================
   PLAYER CONTAINER
===================================================== */

.player-container{

    width:100%;

    max-width:760px;

    background:
        rgba(17,24,39,.95);

    border:
        2px solid
        rgba(255,255,255,.15);

    border-radius:20px;

    padding:24px;

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.6);

    text-align:center;
}


/* =====================================================
   TITLE
===================================================== */

h1{

    display:block;

    width:100%;

    font-size:38px;

    font-weight:900;

    line-height:1;

    margin:0 0 28px;

    text-transform:uppercase;

    letter-spacing:1px;

    white-space:nowrap;

    overflow:hidden;

    color:#ffd700;

    background:
        linear-gradient(
            135deg,
            #fff3a1,
            #ffd700,
            #cca100,
            #ffd700,
            #fff3a1
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        goldShine 6s linear infinite;

    filter:
        drop-shadow(0 1px 0 #b39200)
        drop-shadow(0 2px 0 #997d00)
        drop-shadow(0 3px 0 #806800)
        drop-shadow(0 4px 5px rgba(0,0,0,.6));
}


@keyframes goldShine{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:200% center;
    }

}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    display:flex;

    gap:12px;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;
}


input{

    padding:12px 16px;

    font-size:16px;

    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            145deg,
            #1f2937,
            #111827
        );

    border:
        2px solid
        rgba(255,255,255,.25);

    border-radius:10px;

    outline:none;

    box-shadow:
        inset 0 3px 6px rgba(0,0,0,.6),
        0 5px 10px rgba(0,0,0,.5);

    width:220px;

    height:50px;

    text-align:center;
}


input:focus{

    border-color:#ffd700;

    box-shadow:
        0 0 10px
        rgba(255,215,0,.5);
}


/* =====================================================
   BUTTONS
===================================================== */

button{

    padding:12px 20px;

    min-width:140px;

    font-size:16px;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1px;

    border-radius:12px;

    cursor:pointer;

    color:white;

    border:
        2px solid
        rgba(255,255,255,.25);

    box-shadow:
        inset 0 2px 4px rgba(255,255,255,.35),
        inset 0 -5px 8px rgba(0,0,0,.5),
        0 8px 16px rgba(0,0,0,.6);

    text-shadow:
        0 -1px 2px
        rgba(0,0,0,.8);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
}


button:hover{

    transform:translateY(-2px);

    filter:brightness(1.15);
}


button:active{

    transform:translateY(1px);
}


/* =====================================================
   LOAD CARD
===================================================== */

#loadCardBtn{

    background:
        linear-gradient(
            145deg,
            #60a5fa,
            #2563eb,
            #1e3a8a
        );

    border-color:#93c5fd;
}


/* =====================================================
   HOME BUTTON
===================================================== */

#homeBtn{

    position:fixed;

    top:12px;

    left:12px;

    z-index:9999;

    min-width:auto;

    padding:9px 14px;

    font-size:13px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #f87171,
            #dc2626,
            #7f1d1d
        );

    border-color:#fca5a5;
}


/* =====================================================
   GAME STATE
===================================================== */

#gameState{

    margin:22px auto 20px;

    padding:14px;

    width:100%;

    max-width:650px;

    min-height:46px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #374151,
            #111827
        );

    color:#ffd700;

    font-size:20px;

    font-weight:bold;

    box-shadow:
        inset 0 2px 5px
        rgba(255,255,255,.15),

        0 6px 12px
        rgba(0,0,0,.5);
}


/* =====================================================
   GAME AREA
===================================================== */

#gameArea{

    display:block;

    width:100%;
}


/* =====================================================
   BINGO CARD
===================================================== */

#cardArea{

    width:100%;

    max-width:650px;

    margin:20px auto 0;

    padding:10px;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:8px;

    background:#080d18;

    border:
        2px solid
        rgba(255,255,255,.12);

    border-radius:14px;

    box-shadow:
        inset 0 0 12px
        rgba(0,0,0,.7),

        0 8px 18px
        rgba(0,0,0,.45);
}


/* =====================================================
   BINGO CELLS
===================================================== */

.bingo-cell{

    width:100%;

    aspect-ratio:1 / 1;

    min-width:0;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:5px;

    background:
        linear-gradient(
            145deg,
            #273449,
            #172033
        );

    border:
        2px solid
        #536174;

    border-radius:8px;

    /*
       Comfortable base size.
    */

    font-size:14px;

    font-weight:800;

    line-height:1.08;

    letter-spacing:.1px;

    /*
       IMPORTANT:
       Multi-word answers are allowed
       to wrap naturally.
    */

    white-space:normal;

    overflow-wrap:normal;

    word-break:normal;

    hyphens:none;

    /*
       Keeps the words readable instead
       of breaking individual words.
    */

    overflow:hidden;

    cursor:pointer;

    transition:
        transform .15s ease,
        filter .15s ease,
        background .15s ease;

    user-select:none;

    color:#ffffff;

    text-shadow:
        0 1px 2px
        rgba(0,0,0,.85);
}


/* =====================================================
   HOVER
===================================================== */

.bingo-cell:hover{

    transform:scale(1.03);

    filter:brightness(1.15);
}


/* =====================================================
   MARKED CELL
===================================================== */

.cell-marked{

    background:
        linear-gradient(
            145deg,
            #22c55e,
            #15803d
        );

    border-color:#86efac;

    color:white;

    box-shadow:
        inset 0 0 8px
        rgba(255,255,255,.18),

        0 0 6px
        rgba(34,197,94,.25);
}


/* =====================================================
   FREE SPACE
===================================================== */

.free-space{

    background:
        linear-gradient(
            145deg,
            #fff3a1,
            #ffd700,
            #b8860b
        );

    border-color:#ffe066;

    color:#111827;

    text-shadow:
        0 1px 1px
        rgba(255,255,255,.5);
}


/* =====================================================
   MESSAGE BOX
===================================================== */

.message-box{

    margin-top:18px;

    padding:14px;

    border-radius:10px;

    background:#111827;

    border:
        2px solid
        rgba(255,255,255,.15);

    font-size:17px;
}


.loading{

    color:#60a5fa;

    font-weight:bold;
}


.success{

    color:#22c55e;

    font-weight:bold;
}


.error{

    color:#ef4444;

    font-weight:bold;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:700px){

    body{

        padding:12px;
    }


    .player-container{

        max-width:620px;

        padding:18px;
    }


    h1{

        font-size:30px;

        margin-bottom:22px;
    }


    #gameState{

        font-size:17px;

        padding:12px;
    }


    #cardArea{

        max-width:540px;

        padding:7px;

        gap:6px;
    }


    .bingo-cell{

        font-size:12px;

        padding:4px;

        line-height:1.08;
    }


    .controls{

        flex-direction:column;
    }


    input,
    #loadCardBtn{

        width:100%;

        max-width:300px;
    }


    #homeBtn{

        width:auto;

        max-width:none;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:420px){

    body{

        padding:8px;
    }


    .player-container{

        padding:14px;

        border-radius:16px;
    }


    h1{

        font-size:23px;

        letter-spacing:.5px;

        margin-bottom:18px;
    }


    #cardArea{

        padding:5px;

        gap:4px;

        border-radius:11px;
    }


    .bingo-cell{

        font-size:11px;

        padding:3px;

        line-height:1.08;

        border-width:1px;

        border-radius:5px;
    }


    #gameState{

        margin:16px auto;

        font-size:15px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HOME BUTTON
===================================================== -->

<button
    id="homeBtn"
    type="button">

    HOME

</button>


<!-- =====================================================
     PLAYER CONTAINER
===================================================== -->

<div class="player-container">


<h1>
    SAFETY STANDDOWN BINGO
</h1>


<!-- =====================================================
     CARD CONTROLS
===================================================== -->

<div class="controls">


<input
    id="cardInput"
    type="number"
    placeholder="Enter Card ID">


<button
    id="loadCardBtn"
    type="button">

    LOAD CARD

</button>


</div>


<!-- =====================================================
     GAME AREA
===================================================== -->

<div id="gameArea">


<div id="gameState">

    Waiting for host...

</div>


<div id="cardArea"></div>


</div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="/socket.io/socket.io.js"></script>

<script src="/js/cardGenerator.js"></script>

<script src="/js/audio.js"></script>

<script src="/js/player.js"></script>


<script>

/* =====================================================
   HOME BUTTON
===================================================== */

document
.getElementById("homeBtn")
.addEventListener(
    "click",
    function(){

        window.location.href =
            "/index.html";

    }
);


/* =====================================================
   BINGO TEXT FORMATTER
===================================================== */

function fitBingoCellText(){

    const cells =
        document.querySelectorAll(
            ".bingo-cell"
        );


    cells.forEach(
        cell=>{

            /*
             * Start with the normal readable
             * font size.
             */

            let size = 14;

            cell.style.fontSize =
                size + "px";

            /*
             * Force multi-word answers
             * to use multiple lines.
             */

            cell.style.whiteSpace =
                "normal";

            cell.style.wordBreak =
                "normal";

            cell.style.overflowWrap =
                "normal";

            cell.style.hyphens =
                "none";


            /*
             * If the text is extremely long,
             * reduce it only slightly.
             *
             * We do NOT shrink normal
             * multi-word answers.
             */

            while(
                cell.scrollHeight >
                cell.clientHeight &&
                size > 11
            ){

                size -= 0.5;

                cell.style.fontSize =
                    size + "px";
            }

        }
    );

}


/* =====================================================
   EXPORT
===================================================== */

window.fitBingoCellText =
    fitBingoCellText;


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{
        fitBingoCellText();
    }
);

/* =====================================================
   WATCH FOR NEW BINGO CELLS
===================================================== */

const bingoObserver =
    new MutationObserver(
        ()=>{
            fitBingoCellText();
        }
    );


const cardArea =
    document.getElementById(
        "cardArea"
    );


if(cardArea){

    bingoObserver.observe(
        cardArea,
        {
            childList:true,
            subtree:true
        }
    );

}

/* =====================================================
   INITIAL FIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{
        fitBingoCellText();
    }
);

</script>
</body>
</html>
