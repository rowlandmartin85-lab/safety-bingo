<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Safety Bingo Player</title>

<link rel="stylesheet" href="/css/style.css">

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #0b1b3a,
            #050914
        );

    color:white;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:20px;
}

/* =====================================================
   PLAYER CONTAINER
===================================================== */

.player-container{

    width:100%;

    max-width:760px;

    background:
        rgba(17,24,39,.97);

    border:
        2px solid
        rgba(255,255,255,.15);

    border-radius:20px;

    padding:24px;

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.6);

    text-align:center;
}

/* =====================================================
   TITLE
===================================================== */

h1{

    display:block;

    width:100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:38px;

    font-weight:900;

    line-height:1;

    margin:
        0 0 28px;

    padding:0;

    text-transform:uppercase;

    letter-spacing:1px;

    white-space:nowrap;

    overflow:hidden;

    color:#ffd700;

    background:
        linear-gradient(
            135deg,
            #fff3a1,
            #ffd700,
            #cca100,
            #ffd700,
            #fff3a1
        );

    background-size:200% auto;

    -webkit-background-clip:text;

    background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:
        goldShine
        6s linear infinite;

    filter:
        drop-shadow(
            0 1px 0 #b39200
        )
        drop-shadow(
            0 2px 0 #997d00
        )
        drop-shadow(
            0 3px 0 #806800
        )
        drop-shadow(
            0 4px 5px
            rgba(0,0,0,.6)
        );
}

@keyframes goldShine{

    0%{
        background-position:
            0% center;
    }

    100%{
        background-position:
            200% center;
    }

}

/* =====================================================
   CONTROLS
===================================================== */

.controls{

    display:flex;

    gap:12px;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;
}

input{

    padding:
        12px 16px;

    font-size:16px;

    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            145deg,
            #1f2937,
            #111827
        );

    border:
        2px solid
        rgba(255,255,255,.25);

    border-radius:10px;

    outline:none;

    box-shadow:
        inset 0 3px 6px
        rgba(0,0,0,.6),

        0 5px 10px
        rgba(0,0,0,.5);

    width:220px;

    height:50px;

    text-align:center;
}

input:focus{

    border-color:#ffd700;

    box-shadow:
        0 0 10px
        rgba(255,215,0,.5);
}

/* =====================================================
   BUTTONS
===================================================== */

button{

    padding:
        12px 20px;

    min-width:140px;

    font-size:16px;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:1px;

    border-radius:12px;

    cursor:pointer;

    color:white;

    border:
        2px solid
        rgba(255,255,255,.25);

    box-shadow:
        inset 0 2px 4px
        rgba(255,255,255,.35),

        inset 0 -5px 8px
        rgba(0,0,0,.5),

        0 8px 16px
        rgba(0,0,0,.6);

    text-shadow:
        0 -1px 2px
        rgba(0,0,0,.8);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
}

button:hover{

    transform:
        translateY(-2px);

    filter:
        brightness(1.15);
}

button:active{

    transform:
        translateY(1px);
}

/* =====================================================
   LOAD BUTTON
===================================================== */

#loadCardBtn{

    background:
        linear-gradient(
            145deg,
            #60a5fa,
            #2563eb,
            #1e3a8a
        );

    border-color:#93c5fd;
}

/* =====================================================
   HOME BUTTON
===================================================== */

#homeBtn{

    position:fixed;

    top:12px;

    left:12px;

    z-index:9999;

    min-width:auto;

    padding:
        9px 14px;

    font-size:13px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #f87171,
            #dc2626,
            #7f1d1d
        );

    border-color:#fca5a5;
}

/* =====================================================
   GAME STATE
===================================================== */

#gameState{

    margin:
        22px auto 20px;

    padding:14px;

    width:100%;

    max-width:650px;

    min-height:46px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #374151,
            #111827
        );

    color:#ffd700;

    font-size:20px;

    font-weight:bold;

    box-shadow:
        inset 0 2px 5px
        rgba(255,255,255,.15),

        0 6px 12px
        rgba(0,0,0,.5);
}

/* =====================================================
   GAME AREA
===================================================== */

#gameArea{

    display:block;

    width:100%;
}

/* =====================================================
   BINGO CARD
===================================================== */

#cardArea{

    width:100%;

    max-width:650px;

    margin:
        20px auto 0;

    padding:10px;

    display:grid;

    grid-template-columns:
        repeat(
            5,
            minmax(0,1fr)
        );

    gap:8px;

    background:#080d18;

    border:
        2px solid
        rgba(255,255,255,.12);

    border-radius:14px;

    box-shadow:

        inset 0 0 12px
        rgba(0,0,0,.7),

        0 8px 18px
        rgba(0,0,0,.45);
}

/* =====================================================
   BINGO CELLS
===================================================== */

.bingo-cell{

    width:100%;

    aspect-ratio:1 / 1;

    min-width:0;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    /*
       More room for larger text.
    */

    padding:8px;

    background:
        linear-gradient(
            145deg,
            #263244,
            #182231
        );

    border:
        2px solid
        #526174;

    border-radius:9px;

    /*
       LARGE BASE FONT
    */

    font-size:34px;

    font-weight:900;

    line-height:1.05;

    color:#ffffff;

    /*
       Strong readability.
    */

    text-shadow:

        0 2px 3px
        rgba(0,0,0,.95),

        0 0 2px
        rgba(0,0,0,.9);

    /*
       IMPORTANT:
       Allow the answer to wrap.
    */

    white-space:normal;

    overflow-wrap:anywhere;

    word-break:normal;

    hyphens:none;

    overflow:hidden;

    cursor:pointer;

    user-select:none;

    transition:

        transform .15s ease,

        filter .15s ease,

        background .15s ease,

        box-shadow .15s ease;
}

/* =====================================================
   CELL HOVER
===================================================== */

.bingo-cell:hover{

    transform:
        scale(1.03);

    filter:
        brightness(1.12);

    box-shadow:
        0 0 10px
        rgba(255,255,255,.12);
}

/* =====================================================
   MARKED CELL
===================================================== */

.cell-marked{

    background:
        linear-gradient(
            145deg,
            #22c55e,
            #15803d
        );

    border-color:
        #86efac;

    color:white;

    box-shadow:

        inset 0 0 8px
        rgba(255,255,255,.15),

        0 0 8px
        rgba(34,197,94,.25);

}

/* =====================================================
   FREE SPACE
===================================================== */

.free-space{

    background:
        linear-gradient(
            145deg,
            #fff3a1,
            #ffd700,
            #b8860b
        );

    border-color:
        #ffe066;

    color:#111827;

    text-shadow:

        0 1px 1px
        rgba(255,255,255,.5);

}

/* =====================================================
   MESSAGE BOX
===================================================== */

.message-box{

    margin-top:18px;

    padding:14px;

    border-radius:10px;

    background:#111827;

    border:
        2px solid
        rgba(255,255,255,.15);

    font-size:17px;
}

.loading{

    color:#60a5fa;

    font-weight:bold;
}

.success{

    color:#22c55e;

    font-weight:bold;
}

.error{

    color:#ef4444;

    font-weight:bold;
}

/* =====================================================
   TABLET
===================================================== */

@media(max-width:700px){

    body{

        padding:12px;
    }

    .player-container{

        max-width:620px;

        padding:18px;
    }

    h1{

        font-size:30px;

        margin-bottom:22px;
    }

    #gameState{

        font-size:17px;

        padding:12px;
    }

    #cardArea{

        max-width:540px;

        padding:7px;

        gap:6px;
    }

    .bingo-cell{

        /*
           Large tablet text.
        */

        font-size:26px;

        padding:6px;

        border-radius:7px;

        line-height:1.04;
    }

    .controls{

        flex-direction:column;
    }

    input,
    #loadCardBtn{

        width:100%;

        max-width:300px;
    }

    #homeBtn{

        width:auto;

        max-width:none;
    }

}

/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:420px){

    body{

        padding:8px;
    }

    .player-container{

        padding:14px;

        border-radius:16px;
    }

    h1{

        font-size:23px;

        letter-spacing:.5px;

        margin-bottom:18px;
    }

    #cardArea{

        padding:5px;

        gap:4px;

        border-radius:11px;
    }

    .bingo-cell{

        /*
           Still intentionally large.
        */

        font-size:22px;

        padding:4px;

        border-width:1px;

        border-radius:5px;

        line-height:1.02;
    }

    #gameState{

        margin:
            16px auto;

        font-size:15px;
    }

}

/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:350px){

    .bingo-cell{

        font-size:18px;

        padding:3px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="/socket.io/socket.io.js"></script>

<script src="/js/cardGenerator.js"></script>

<script src="/js/audio.js"></script>

<script src="/js/player.js"></script>

<script>

/* =====================================================
   HOME BUTTON
===================================================== */

document
.getElementById("homeBtn")
.addEventListener(
    "click",
    function(){

        window.location.href =
            "/index.html";

    }
);


/* =====================================================
   LARGE TEXT FITTING
===================================================== */

/*
   IMPORTANT:

   The old version continuously reduced
   the font size to make every answer
   fit on one line.

   That made the card difficult to read.

   This version does the opposite.

   It starts LARGE and only reduces
   when absolutely necessary.

   It also allows wrapping.
*/

function fitBingoCellText(){

    const cells =
        document.querySelectorAll(
            ".bingo-cell"
        );


    cells.forEach(
        cell=>{

            /*
             * Start very large.
             */

            let size = 34;


            cell.style.fontSize =
                size + "px";


            cell.style.whiteSpace =
                "normal";


            cell.style.overflowWrap =
                "anywhere";


            cell.style.wordBreak =
                "normal";


            /*
             * Allow the text to wrap
             * before shrinking.
             *
             * Minimum desktop size:
             * 22px.
             */

            while(

                (
                    cell.scrollHeight >
                    cell.clientHeight

                    ||

                    cell.scrollWidth >
                    cell.clientWidth
                )

                &&

                size > 22

            ){

                size -= 1;


                cell.style.fontSize =
                    size + "px";

            }


            /*
             * If it still does not fit,
             * use the minimum readable
             * size rather than making it tiny.
             */

            if(size < 22){

                cell.style.fontSize =
                    "22px";

            }

        }
    );

}


/* =====================================================
   GLOBAL FUNCTION
===================================================== */

window.fitBingoCellText =
    fitBingoCellText;


/* =====================================================
   WATCH FOR CARD CREATION
===================================================== */

const cardArea =
    document.getElementById(
        "cardArea"
    );


if(cardArea){

    const observer =
        new MutationObserver(
            ()=>{

                /*
                 * Wait one frame so the
                 * browser has calculated
                 * the new cell dimensions.
                 */

                requestAnimationFrame(
                    ()=>{
                        fitBingoCellText();
                    }
                );

            }
        );


    observer.observe(
        cardArea,
        {
            childList:true,
            subtree:true
        }
    );

}


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        requestAnimationFrame(
            ()=>{
                fitBingoCellText();
            }
        );

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{
                fitBingoCellText();
            },
            150
        );

    }
);


/* =====================================================
   EXTRA CARD REFRESH
===================================================== */

setTimeout(
    ()=>{
        fitBingoCellText();
    },
    500
);

</script>

</body>
