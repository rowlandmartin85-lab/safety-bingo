<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Safety Bingo Player</title>
<link rel="stylesheet" href="/css/style.css">
<style>
html{
margin:0;
padding:0;
width:100%;
min-height:100%;
overflow-x:hidden;
}

body{
margin:0;
min-height:149.2537vh;
width:149.2537%;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#0b1b3a,#050914);
color:white;
display:flex;
justify-content:center;
align-items:flex-start;
padding:44.7761px;
zoom:.67;
}

#homeBtn{
position:fixed;
top:15px;
left:15px;
padding:9px 16px;
font-size:14px;
font-weight:bold;
text-transform:uppercase;
border-radius:8px;
cursor:pointer;
color:white;
border:2px solid #fca5a5;
background:linear-gradient(145deg,#ef4444,#dc2626,#991b1b);
box-shadow:0 4px 8px rgba(0,0,0,.5);
z-index:1000;
}

#homeBtn:hover{
transform:translateY(-2px);
filter:brightness(1.15);
}

#homeBtn:active{
transform:translateY(2px);
}

.player-container{
width:100%;
max-width:900px;
background:rgba(17,24,39,.95);
border:2px solid rgba(255,255,255,.15);
border-radius:20px;
padding:30px;
box-shadow:0 20px 45px rgba(0,0,0,.6);
text-align:center;
}

h1{
color:#ffd700;
font-size:42px;
font-weight:900;
margin-bottom:25px;
text-transform:uppercase;
letter-spacing:2px;
}

.controls{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

input{
padding:15px;
font-size:18px;
border-radius:10px;
border:2px solid #374151;
background:#111827;
color:white;
width:250px;
}

input:focus{
outline:none;
border-color:#60a5fa;
}

button{
padding:15px 25px;
font-size:18px;
font-weight:bold;
text-transform:uppercase;
border-radius:10px;
cursor:pointer;
color:white;
border:2px solid #93c5fd;
background:linear-gradient(145deg,#60a5fa,#2563eb,#1e3a8a);
box-shadow:0 6px 12px rgba(0,0,0,.5);
transition:.15s ease;
}

button:hover{
transform:translateY(-2px);
filter:brightness(1.15);
}

button:active{
transform:translateY(2px);
}

#gameState{
margin:25px auto;
padding:20px;
max-width:700px;
min-height:50px;
border-radius:15px;
background:linear-gradient(145deg,#374151,#111827);
color:#ffd700;
font-size:24px;
font-weight:bold;
box-shadow:inset 0 2px 5px rgba(255,255,255,.15),0 6px 12px rgba(0,0,0,.5);
}

#cardArea{
margin-top:30px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.bingo-cell{
aspect-ratio:1;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:10px;
background:#1f2937;
border-radius:10px;
border:2px solid #4b5563;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:.2s ease;
user-select:none;
}

.bingo-cell:hover{
transform:scale(1.05);
filter:brightness(1.15);
}

.cell-marked{
background:linear-gradient(145deg,#22c55e,#15803d);
border-color:#86efac;
color:white;
}

.free-space{
background:linear-gradient(145deg,#fff3a1,#ffd700,#b8860b);
border-color:#ffe066;
color:#111827;
}

#gameArea{
display:block;
}

.message-box{
margin-top:20px;
padding:15px;
border-radius:12px;
background:#111827;
border:2px solid rgba(255,255,255,.15);
font-size:18px;
}

.loading{
color:#60a5fa;
font-weight:bold;
}

.success{
color:#22c55e;
font-weight:bold;
}

.error{
color:#ef4444;
font-weight:bold;
}

@media(max-width:700px){
body{
padding:22.388px;
}

.player-container{
padding:20px;
}

h1{
font-size:30px;
}

#cardArea{
grid-template-columns:repeat(3,1fr);
}

.bingo-cell{
font-size:12px;
padding:5px;
}

.controls{
flex-direction:column;
}

input,button{
width:100%;
}

#homeBtn{
top:10px;
left:10px;
padding:8px 13px;
font-size:13px;
width:auto;
}
}
</style>
</head>
<body>

<button id="homeBtn" type="button" onclick="window.location.href='index.html'">HOME</button>

<div class="player-container">
<h1>SAFETY STANDDOWN BINGO</h1>

<div class="controls">
<input id="cardInput" type="number" placeholder="Enter Card ID">
<button id="loadCardBtn">Load Card</button>
</div>

<div id="gameArea">
<div id="gameState">Waiting for host...</div>
<div id="cardArea"></div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/cardGenerator.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
