<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safety Standdown Bingo - Player</title>
<link rel="stylesheet" href="/css/player.css">
<style>
.player-container h1{
font-size:clamp(42px,6vw,82px);
font-weight:900;
margin:0 0 35px;
text-transform:uppercase;
letter-spacing:2px;
white-space:nowrap;
background:linear-gradient(135deg,#fff3a1,#ffd700,#cca100,#ffd700,#fff3a1);
background-size:200% auto;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
animation:goldShine 6s linear infinite;
filter:drop-shadow(0 1px 0 #b39200) drop-shadow(0 2px 0 #997d00) drop-shadow(0 3px 0 #806800) drop-shadow(0 4px 5px rgba(0,0,0,.6));
}
@keyframes goldShine{
0%{background-position:0% center}
100%{background-position:200% center}
}
</style>
</head>
<body>
<button id="homeBtn" type="button">HOME</button>
<div class="player-container">
<h1>Safety Standdown Bingo</h1>
<div id="playerContent"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
