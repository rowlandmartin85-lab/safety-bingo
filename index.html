<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Standdown Bingo</title>

<link rel="stylesheet" href="style.css">

<style>
   body {
    margin: 0;
    font-family: Arial, sans-serif;
    /* Updated to match the darker display.html background */
    background: radial-gradient(circle at top, #0b1b3a, #050914);
    color: white;
}

    .menu-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 25px;
    }

    /* 3D METALLIC GOLD TITLE HEADER LOGIC WITH CONTINUOUS SHINE (COPIED FROM DISPLAY) */
    h1 {
        font-size: 82px; 
        font-weight: 900;
        margin: 0 0 10px 0; /* Adjusted slightly to sit nicely with your h2 subtitle */
        text-transform: uppercase;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #fff3a1 0%, #ffd700 25%, #cca100 50%, #ffd700 75%, #fff3a1 100%);
        background-size: 200% auto;
        
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        
        animation: subtleGoldShine 6s linear infinite;
        
        filter: 
            drop-shadow(0 1px 0 #b39200)
            drop-shadow(0 2px 0 #997d00)
            drop-shadow(0 3px 0 #806800)
            drop-shadow(0 4px 2px rgba(0,0,0,0.6))
            drop-shadow(0 0 8px rgba(255,215,0,0.2));
    }

    @keyframes subtleGoldShine {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    /* BIG SUBTITLE */
    h2 {
        font-size: 28px;
        font-weight: normal;
        color: #cbd5e1;
        margin: 0;
    }

    .menu-buttons {
        display: flex;
        flex-direction: row;
        gap: 25px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 20px;
    }

    /* BIG METALLIC BUTTONS */
    .btn {
        width: 260px;
        padding: 22px 28px;
        font-size: 22px;
        border-radius: 14px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        
        /* Premium Brushed Metal Highlight Effects */
        border: 2px solid rgba(255, 255, 255, 0.25);
        box-shadow: 
            inset 0 2px 4px rgba(255, 255, 255, 0.4), 
            inset 0 -4px 6px rgba(0, 0, 0, 0.4),
            0 8px 16px rgba(0, 0, 0, 0.6);
            
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
        transform: translateY(-4px) scale(1.04);
        filter: brightness(1.15);
        box-shadow: 
            inset 0 2px 4px rgba(255, 255, 255, 0.5), 
            inset 0 -4px 6px rgba(0, 0, 0, 0.3),
            0 12px 20px rgba(0, 0, 0, 0.7);
    }

    .btn:active {
        transform: translateY(2px) scale(0.98);
        box-shadow: 
            inset 0 4px 6px rgba(0, 0, 0, 0.6),
            0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* Metallic Shading Preserving Original Colors */
    #hostBtn {
        background: linear-gradient(145deg, #22c55e, #16a34a, #14532d);
        color: white;
        border-color: #4ade80;
        text-shadow: 0 -1px 2px rgba(0,0,0,0.5), 0 1px 2px rgba(255,255,255,0.3);
    }

    #playerBtn {
        background: linear-gradient(145deg, #3b82f6, #2563eb, #1e3a8a);
        color: white;
        border-color: #60a5fa;
        text-shadow: 0 -1px 2px rgba(0,0,0,0.5), 0 1px 2px rgba(255,255,255,0.3);
    }

    #displayBtn {
        background: linear-gradient(145deg, #374151, #111827, #030712);
        color: white;
        border-color: #4b5563;
        text-shadow: 0 -1px 2px rgba(0,0,0,0.8);
    }

    .version {
        margin-top: 30px;
        font-size: 16px;
        color: #64748b;
    }

   /* =====================================================
   MATCHING HOST PAGE 3D METALLIC BUTTON SYSTEM
   ===================================================== */

button {

    padding: 14px 28px;

    font-size: 18px;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1px;

    border-radius: 10px;

    cursor: pointer;

    color: white;

    border: 2px solid rgba(255,255,255,0.35);

    background:
    linear-gradient(
        145deg,
        #f8fafc,
        #94a3b8,
        #475569,
        #cbd5e1
    );

    text-shadow:
        0 2px 2px rgba(0,0,0,0.8);

    box-shadow:

        inset 0 3px 5px rgba(255,255,255,0.8),

        inset 0 -5px 8px rgba(0,0,0,0.5),

        0 6px 12px rgba(0,0,0,0.6);

    transition:
        transform .15s ease,
        filter .15s ease,
        box-shadow .15s ease;

}


/* Hover */

button:hover {

    transform:
    translateY(-3px)
    scale(1.04);


    filter:
    brightness(1.2);


}


/* Press */

button:active {

    transform:
    translateY(2px)
    scale(.98);


    box-shadow:

        inset 0 4px 8px rgba(0,0,0,0.6);

}



/* Gold accent buttons */

#addQuestionBtn,
#loadCardBtn,
.primary-button {

    background:
    linear-gradient(
        145deg,
        #fff3a1,
        #ffd700,
        #b8860b,
        #ffd700
    );

    color:#111827;

    border-color:#ffe066;


    text-shadow:
    0 1px 1px rgba(255,255,255,.8);

}



/* Red safety buttons */

#removeQuestionBtn,
.danger-button {

    background:
    linear-gradient(
        145deg,
        #ff6b6b,
        #dc2626,
        #7f1d1d
    );

    border-color:#f87171;

}



/* Blue action buttons */

.blue-button {

    background:
    linear-gradient(
        145deg,
        #60a5fa,
        #2563eb,
        #1e3a8a
    );

    border-color:#93c5fd;

}
</style>

</head>

<body id="indexPage">

<div class="menu-container">

    <h1>Safety Standdown Bingo</h1>

    <h2>Training Safety Challenge System</h2>

    <div class="menu-buttons">

        <button id="hostBtn" class="btn" onclick="window.location.href='host.html'">HOST GAME</button>

        <button id="playerBtn" class="btn" onclick="window.location.href='player.html'">PLAYER</button>

        <button id="displayBtn" class="btn">DISPLAY</button>

    </div>

    <div class="version">Version 2.0</div>

</div>

<script src="js/app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("displayBtn").addEventListener("click", () => {
        window.open("display.html", "_blank");
    });

});
</script>

</body>
</html>
