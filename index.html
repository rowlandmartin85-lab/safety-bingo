<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Crucial for scaling across mobile phones, tablets, and desktop displays -->
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Safety Standdown Bingo</title>

<link rel="stylesheet" href="/css/style.css">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #0b1b3a, #050914);
        color: white;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
    }

    .menu-container {
        width: 100%;
        max-width: 1200px;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 24px;
    }

    /* =====================================================
       3D METALLIC GOLD TITLE
       ===================================================== */

    h1 {
        font-size: clamp(2.2rem, 6vw, 5.2rem);
        font-weight: 900;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1.1;

        background: linear-gradient(
            135deg,
            #fff3a1 0%,
            #ffd700 25%,
            #cca100 50%,
            #ffd700 75%,
            #fff3a1 100%
        );

        background-size: 200% auto;

        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;

        animation: subtleGoldShine 6s linear infinite;

        filter:
            drop-shadow(0 1px 0 #b39200)
            drop-shadow(0 2px 0 #997d00)
            drop-shadow(0 3px 0 #806800)
            drop-shadow(0 4px 2px rgba(0,0,0,0.6))
            drop-shadow(0 0 8px rgba(255,215,0,0.2));
    }

    @keyframes subtleGoldShine {
        0% {
            background-position: 0% center;
        }

        100% {
            background-position: 200% center;
        }
    }

    /* =====================================================
       SUBTITLE
       ===================================================== */

    h2 {
        font-size: clamp(1rem, 2.5vw, 1.75rem);
        font-weight: normal;
        color: #cbd5e1;
        margin: 0;
    }

    /* =====================================================
       BUTTON GROUP
       ===================================================== */

    .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 20px;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 900px;
        margin-top: 20px;
    }

    /* =====================================================
       BIG METALLIC BUTTONS
       ===================================================== */

    .btn {
        width: 100%;
        max-width: 320px;
        padding: 22px 28px;
        font-size: 1.25rem;
        border-radius: 14px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;

        -webkit-tap-highlight-color: transparent;

        border: 2px solid rgba(255, 255, 255, 0.25);

        box-shadow:
            inset 0 2px 4px rgba(255, 255, 255, 0.4),
            inset 0 -4px 6px rgba(0, 0, 0, 0.4),
            0 8px 16px rgba(0, 0, 0, 0.6);

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            filter 0.15s ease;
    }

    .btn:hover {
        transform: translateY(-4px) scale(1.04);
        filter: brightness(1.15);

        box-shadow:
            inset 0 2px 4px rgba(255, 255, 255, 0.5),
            inset 0 -4px 6px rgba(0, 0, 0, 0.3),
            0 12px 20px rgba(0, 0, 0, 0.7);
    }

    .btn:active {
        transform: translateY(2px) scale(0.98);

        box-shadow:
            inset 0 4px 6px rgba(0, 0, 0, 0.6),
            0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* =====================================================
       HOST BUTTON
       ===================================================== */

    #hostBtn {
        background: linear-gradient(
            145deg,
            #22c55e,
            #16a34a,
            #14532d
        );

        color: white;
        border-color: #4ade80;

        text-shadow:
            0 -1px 2px rgba(0,0,0,0.5),
            0 1px 2px rgba(255,255,255,0.3);
    }

    /* =====================================================
       PLAYER BUTTON
       ===================================================== */

    #playerBtn {
        background: linear-gradient(
            145deg,
            #3b82f6,
            #2563eb,
            #1e3a8a
        );

        color: white;
        border-color: #60a5fa;

        text-shadow:
            0 -1px 2px rgba(0,0,0,0.5),
            0 1px 2px rgba(255,255,255,0.3);
    }

    /* =====================================================
       DISPLAY BUTTON
       ===================================================== */

    #displayBtn {
        background: linear-gradient(
            145deg,
            #374151,
            #111827,
            #030712
        );

        color: white;
        border-color: #4b5563;

        text-shadow:
            0 -1px 2px rgba(0,0,0,0.8);
    }

    /* =====================================================
       VERSION
       ===================================================== */

    .version {
        margin-top: 20px;
        font-size: 1rem;
        color: #64748b;
    }

    /* =====================================================
       DESKTOP & TABLET LANDSCAPE
       ===================================================== */

    @media (min-width: 768px) {

        .menu-container {
            padding: 60px 40px;
            gap: 32px;
        }

        .menu-buttons {
            flex-direction: row;
            gap: 24px;
        }

        .btn {
            flex: 1;
            max-width: 260px;
            padding: 22px 20px;
            font-size: 1.2rem;
        }
    }
</style>
</head>


<body id="indexPage">

<div class="menu-container">

    <h1>Safety Standdown Bingo</h1>

    <h2>Training Safety Challenge</h2>

    <div class="menu-buttons">

        <!-- =================================================
             HOST GAME

             IMPORTANT:
             We no longer go directly to host.html.

             We first set a temporary flag telling the
             host page that this should be a NEW GAME.
             ================================================= -->

        <button
            id="hostBtn"
            class="btn"
            onclick="startNewHostGame()"
        >
            HOST GAME
        </button>


        <!-- PLAYER -->

        <button
            id="playerBtn"
            class="btn"
            onclick="window.location.href='player.html'"
        >
            PLAYER
        </button>


        <!-- DISPLAY -->

        <button
            id="displayBtn"
            class="btn"
        >
            DISPLAY
        </button>

    </div>


    <div class="version">
        Version 2.0
    </div>

</div>


<!-- =====================================================
     MAIN APPLICATION JAVASCRIPT
     ===================================================== -->

<script src="js/app.js"></script>


<script>

/*
===========================================================
START NEW HOST GAME
===========================================================

This does NOT clear localStorage.

Your actual Bingo game lives on the Node/Socket.IO server.

We simply set a temporary browser flag.

When host.html connects to Socket.IO, it sees this flag
and sends "hostReset" to the server.
===========================================================
*/

function startNewHostGame() {

    console.log(
        "NEW HOST GAME REQUESTED"
    );


    sessionStorage.setItem(
        "startNewHostGame",
        "true"
    );


    window.location.href =
        "host.html";
}


/*
===========================================================
DISPLAY BUTTON
===========================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const displayButton =
            document.getElementById(
                "displayBtn"
            );


        if (displayButton) {

            displayButton.addEventListener(
                "click",
                () => {

                    window.open(
                        "display.html",
                        "_blank"
                    );

                }
            );

        }

    }
);

</script>

</body>
</html>
