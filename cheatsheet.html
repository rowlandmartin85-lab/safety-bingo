<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Question Key</title>
  <style>
    /* =====================================================
       GLOBAL
    ===================================================== */
    body {
      background: #101820;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px;
      margin: 0;
    }

    /* =====================================================
       TITLE & COUNTER
    ===================================================== */
    h1 {
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }

    .question-counter {
      text-align: center;
      color: #FFD700;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* =====================================================
       QUESTION LIST & ITEMS
    ===================================================== */
    #questionList {
      max-width: 900px;
      margin: auto;
    }

    .question {
      background: #222222;
      margin: 15px 0;
      padding: 20px;
      border-left: 6px solid #555555;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .question.current {
      background: #1c4424;
      border-left: 8px solid #00ff66;
    }

    .number {
      color: #FFD700;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .answer {
      color: #8cff8c;
      margin-top: 15px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #aaaaaa;
      font-size: 20px;
      margin-top: 40px;
    }

    /* =====================================================
       CONNECTION BANNERS
    ===================================================== */
    .connection {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      z-index: 9999;
      background: #ffc107;
      color: #212529;
      transition: opacity 0.3s ease;
    }

    .connection.hidden {
      display: none;
    }

    .connection.connected {
      background: #28a745;
      color: #ffffff;
    }

    .connection.disconnected {
      background: #dc3545;
      color: #ffffff;
    }

    /* =====================================================
       RESPONSIVE DESIGN
    ===================================================== */
    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      h1 {
        font-size: 28px;
      }
      .question-counter {
        font-size: 26px;
        margin-bottom: 20px;
      }
      .question {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Connection Status Banner -->
  <div id="connectionStatus" class="connection">Connecting to game server...</div>

  <!-- Page Header -->
  <h1>Live Game Question Key</h1>
  <div id="questionCounter" class="question-counter">0 / 93 questions</div>

  <!-- Main Question Feed -->
  <div id="questionList">
    <div class="status">Waiting for game...</div>
  </div>

  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    "use strict";

    /* =====================================================
       CONFIGURATION & STATE
    ===================================================== */
    const TOTAL_QUESTIONS = 93;
    const questions = [];
    const seenQuestionIds = new Set();

    /* =====================================================
       DOM ELEMENTS
    ===================================================== */
    const container = document.getElementById("questionList");
    const questionCounter = document.getElementById("questionCounter");
    const connectionStatus = document.getElementById("connectionStatus");

    /* =====================================================
       SOCKET INITIALIZATION
    ===================================================== */
    const socket = io(window.location.origin, {
      transports: ["polling", "websocket"],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000
    });

    /* =====================================================
       UI HELPERS
    ===================================================== */
    function updateQuestionCounter() {
      if (questionCounter) {
        questionCounter.textContent = `${questions.length} / ${TOTAL_QUESTIONS} questions`;
      }
    }

    function setConnectionStatus(message, state) {
      if (!connectionStatus) return;

      connectionStatus.textContent = message;
      connectionStatus.classList.remove("hidden", "connected", "disconnected");

      if (state) {
        connectionStatus.classList.add(state);
      }
    }

    /* =====================================================
       RENDER LOGIC
    ===================================================== */
    function renderQuestions() {
      container.replaceChildren();

      if (questions.length === 0) {
        const waitingDiv = document.createElement("div");
        waitingDiv.className = "status";
        waitingDiv.textContent = "Waiting for game...";
        container.appendChild(waitingDiv);
        updateQuestionCounter();
        return;
      }

      const fragment = document.createDocumentFragment();

      questions.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = `question${index === questions.length - 1 ? " current" : ""}`;

        const numDiv = document.createElement("div");
        numDiv.className = "number";
        numDiv.textContent = `Question #${item.number ?? index + 1}`;

        const textDiv = document.createElement("div");
        textDiv.textContent = item.question ?? "";

        const answerDiv = document.createElement("div");
        answerDiv.className = "answer";
        answerDiv.textContent = `Answer: ${item.answer ?? ""}`;

        div.append(numDiv, textDiv, answerDiv);
        fragment.appendChild(div);
      });

      container.appendChild(fragment);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    /* =====================================================
       SOCKET EVENT LISTENERS
    ===================================================== */
    socket.on("connect", () => {
      console.log("QUESTION KEY CONNECTED:", socket.id);
      setConnectionStatus("Connected to Game Server", "connected");

      setTimeout(() => {
        if (socket.connected) {
          connectionStatus.classList.add("hidden");
        }
      }, 2000);
    });

    socket.on("disconnect", (reason) => {
      console.warn("QUESTION KEY DISCONNECTED:", reason);
      setConnectionStatus("Disconnected — Reconnecting...", "disconnected");
    });

    socket.on("connect_error", (error) => {
      console.error("QUESTION KEY CONNECTION ERROR:", error);
      setConnectionStatus("Unable to connect to game server", "disconnected");
    });

    socket.io.on("reconnect_attempt", (attempt) => {
      console.log("QUESTION KEY RECONNECT ATTEMPT:", attempt);
      setConnectionStatus("Reconnecting to game server...", "disconnected");
    });

    socket.on("gameReset", () => {
      console.log("QUESTION KEY RESET");
      questions.length = 0;
      seenQuestionIds.clear();
      updateQuestionCounter();
      renderQuestions();
    });

    socket.on("cheatSheetQuestion", (question) => {
      console.log("QUESTION RECEIVED:", question);
      if (!question) return;

      const questionID = question.id ?? question.questionID ?? question.number;

      if (questionID !== undefined) {
        if (seenQuestionIds.has(questionID)) {
          console.log("DUPLICATE QUESTION IGNORED:", questionID);
          return;
        }
        seenQuestionIds.add(questionID);
      }

      questions.push(question);
      updateQuestionCounter();
      renderQuestions();
    });

    /* =====================================================
       INITIALIZATION
    ===================================================== */
    updateQuestionCounter();
    setConnectionStatus("Connecting to game server...", "connecting");
  </script>
</body>
</html>
