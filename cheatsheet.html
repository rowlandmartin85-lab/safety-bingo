<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Live Question Key</title>

  <style>
    /* =====================================================
       GLOBAL
    ===================================================== */

    body {
      background: #101820;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }


    /* =====================================================
       TOP GAME COUNTER
       
       THIS SHOWS:

       1/91
       2/91
       3/91

       It is NOT the official question number.
    ===================================================== */

    #questionCounter {
      text-align: center;
      color: #00ff66;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }


    /* =====================================================
       QUESTION LIST
    ===================================================== */

    #questionList {
      max-width: 900px;
      margin: auto;
    }

    .question {
      background: #222222;
      margin: 15px 0;
      padding: 20px;
      border-left: 6px solid #555555;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .question.current {
      background: #1c4424;
      border-left: 8px solid #00ff66;
    }


    /* =====================================================
       OFFICIAL QUESTION NUMBER
    ===================================================== */

    .number {
      color: #FFD700;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }


    /* =====================================================
       ANSWER
    ===================================================== */

    .answer {
      color: #8cff8c;
      margin-top: 15px;
      font-weight: bold;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {
      text-align: center;
      color: #aaaaaa;
      font-size: 20px;
      margin-top: 40px;
    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    .connection {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      z-index: 9999;

      background: #ffc107;
      color: #212529;
    }

    .connection.hidden {
      display: none;
    }

    .connection.connected {
      background: #28a745;
      color: #ffffff;
    }

    .connection.disconnected {
      background: #dc3545;
      color: #ffffff;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      #questionCounter {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .question {
        padding: 16px;
      }

    }
  </style>
</head>


<body>


  <!-- =====================================================
       CONNECTION STATUS
    ===================================================== -->

  <div id="connectionStatus" class="connection">
    Connecting to game server...
  </div>


  <!-- =====================================================
       HEADER
    ===================================================== -->

  <h1>Live Game Question Key</h1>


  <!-- =====================================================
       TOP GAME POSITION COUNTER

       THIS WILL SHOW:

       0/91
       1/91
       2/91
       3/91

       It NEVER uses the official question number.
    ===================================================== -->

  <div id="questionCounter">
    0/0
  </div>


  <!-- =====================================================
       QUESTION LIST
    ===================================================== -->

  <div id="questionList">

    <div class="status">
      Waiting for game...
    </div>

  </div>


  <!-- =====================================================
       SOCKET.IO
    ===================================================== -->

  <script src="/socket.io/socket.io.js"></script>


  <script>
    "use strict";

    console.log("LIVE QUESTION KEY LOADED");


    /* =====================================================
       DOM REFERENCES
    ===================================================== */

    const container =
      document.getElementById("questionList");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const questionCounter =
      document.getElementById("questionCounter");


    /* =====================================================
       STATE
    ===================================================== */

    /*
      All questions that have been READ during the
      current game.

      This array controls the top counter.

      Example:

      questions.length = 1
      => 1/91

      questions.length = 2
      => 2/91

      questions.length = 3
      => 3/91
    */

    let questions = [];


    /*
      Prevent the same database question from being
      added twice.
    */

    const seenQuestionIds = new Set();


    /*
      Total number of questions in the database.

      Example:

      91
    */

    let totalQuestions = 0;


    /* =====================================================
       UPDATE TOP COUNTER
       
       IMPORTANT:

       DO NOT use currentQuestionNumber here.

       The server's currentQuestionNumber may be the
       official question number.

       Instead, use:

       questions.length

       This guarantees:

       1/91
       2/91
       3/91
    ===================================================== */

    function updateQuestionCounter() {

      if (!questionCounter) {
        return;
      }


      const questionsRead =
        questions.length;


      questionCounter.textContent =
        `${questionsRead}/${totalQuestions || "?"}`;

    }


    /* =====================================================
       LOAD TOTAL QUESTIONS FROM DATABASE
    ===================================================== */

    async function loadTotalQuestions() {

      console.log(
        "LOADING TOTAL QUESTIONS FROM /api/questions..."
      );


      try {

        const response =
          await fetch("/api/questions", {
            method: "GET",
            cache: "no-store"
          });


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const allQuestions =
          await response.json();


        if (Array.isArray(allQuestions)) {

          totalQuestions =
            allQuestions.length;


          console.log(
            "TOTAL QUESTIONS IN DATABASE:",
            totalQuestions
          );


          /*
            Update only the TOTAL.

            The current position comes from
            questions.length.
          */

          updateQuestionCounter();


        } else {

          console.error(
            "API /api/questions DID NOT RETURN AN ARRAY:",
            allQuestions
          );

        }


      } catch (error) {

        console.error(
          "FAILED TO LOAD TOTAL QUESTIONS:",
          error
        );

      }

    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    function setConnectionStatus(message, state) {

      if (!connectionStatus) {
        return;
      }


      connectionStatus.textContent =
        message;


      connectionStatus.className =
        "connection";


      if (state) {

        connectionStatus.classList.add(
          state
        );

      }

    }


    /* =====================================================
       GET OFFICIAL QUESTION NUMBER
       
       THIS IS ONLY FOR THE QUESTION CARD.

       It has NOTHING to do with the 1/91 counter.
    ===================================================== */

    function getOfficialQuestionNumber(item, index) {

      /*
        Keep your existing official question-number
        logic.

        If the server sends currentQuestionNumber,
        use it for the question card.

        This does NOT affect the top counter.
      */

      let number =
        item.currentQuestionNumber;


      if (
        !Number.isFinite(Number(number))
      ) {

        number =
          item.questionPosition;

      }


      if (
        !Number.isFinite(Number(number))
      ) {

        number =
          item.number;

      }


      if (
        !Number.isFinite(Number(number))
      ) {

        number =
          index + 1;

      }


      return Number(number);

    }


    /* =====================================================
       RENDER QUESTIONS
    ===================================================== */

    function renderQuestions() {

      if (!container) {
        return;
      }


      container.replaceChildren();


      /*
        No questions have been read yet.
      */

      if (questions.length === 0) {

        const statusDiv =
          document.createElement("div");


        statusDiv.className =
          "status";


        statusDiv.textContent =
          "Waiting for game...";


        container.appendChild(
          statusDiv
        );


        /*
          Make sure top counter is also updated.
        */

        updateQuestionCounter();


        return;
      }


      const fragment =
        document.createDocumentFragment();


      questions.forEach((item, index) => {


        /* =================================================
           QUESTION CONTAINER
        ================================================= */

        const div =
          document.createElement("div");


        /*
          The newest question is highlighted.
        */

        div.className =
          "question" +
          (
            index === questions.length - 1
              ? " current"
              : ""
          );


        /* =================================================
           OFFICIAL QUESTION NUMBER
           
           Example:

           Question #37

           This remains separate from:

           1/91
        ================================================= */

        const officialNumber =
          getOfficialQuestionNumber(
            item,
            index
          );


        const numberDiv =
          document.createElement("div");


        numberDiv.className =
          "number";


        numberDiv.textContent =
          `Question #${officialNumber}`;


        /* =================================================
           QUESTION TEXT
        ================================================= */

        const textDiv =
          document.createElement("div");


        textDiv.textContent =
          item.question ??
          item.q ??
          "";


        /* =================================================
           ANSWER
        ================================================= */

        const answerDiv =
          document.createElement("div");


        answerDiv.className =
          "answer";


        answerDiv.textContent =
          `Answer: ${
            item.answer ??
            item.a ??
            ""
          }`;


        /* =================================================
           ADD TO QUESTION
        ================================================= */

        div.append(
          numberDiv,
          textDiv,
          answerDiv
        );


        fragment.appendChild(
          div
        );

      });


      container.appendChild(
        fragment
      );


      /*
        Update the top counter.

        Because questions.length is now:

        1
        2
        3

        the counter becomes:

        1/91
        2/91
        3/91
      */

      updateQuestionCounter();


      /* =====================================================
         SCROLL TO NEWEST QUESTION
      ===================================================== */

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    }


    /* =====================================================
       SOCKET.IO
    ===================================================== */

    const socket =
      io(window.location.origin, {

        transports: [
          "polling",
          "websocket"
        ],

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 1000,

        reconnectionDelayMax: 5000

      });


    /* =====================================================
       SOCKET CONNECTED
    ===================================================== */

    socket.on("connect", async () => {

      console.log(
        "QUESTION KEY CONNECTED:",
        socket.id
      );


      setConnectionStatus(
        "Connected to Game Server",
        "connected"
      );


      /*
        Get total number of questions from database.
      */

      await loadTotalQuestions();


      /*
        Hide connection banner after 2 seconds.
      */

      setTimeout(() => {

        if (socket.connected) {

          connectionStatus.classList.add(
            "hidden"
          );

        }

      }, 2000);

    });


    /* =====================================================
       SOCKET DISCONNECTED
    ===================================================== */

    socket.on("disconnect", (reason) => {

      console.warn(
        "QUESTION KEY DISCONNECTED:",
        reason
      );


      setConnectionStatus(
        "Disconnected — Reconnecting...",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET CONNECTION ERROR
    ===================================================== */

    socket.on("connect_error", (error) => {

      console.error(
        "QUESTION KEY CONNECTION ERROR:",
        error
      );


      setConnectionStatus(
        "Unable to connect to game server",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET RECONNECT
    ===================================================== */

    socket.io.on(
      "reconnect_attempt",
      (attempt) => {

        console.log(
          "QUESTION KEY RECONNECT ATTEMPT:",
          attempt
        );


        setConnectionStatus(
          "Reconnecting to game server...",
          "disconnected"
        );

      }
    );


    /* =====================================================
       GAME STATE
       
       IMPORTANT:

       We DO NOT use currentQuestionNumber from
       gameState to control the top counter.

       That value may be the official question number.

       The top counter is controlled by questions.length.
    ===================================================== */

    socket.on("gameState", (state) => {

      console.log(
        "QUESTION KEY GAME STATE:",
        state
      );


      if (!state) {
        return;
      }


      /*
        If the game state gives us a total,
        we can use it.
      */

      if (
        Number.isFinite(
          Number(state.totalQuestions)
        )
      ) {

        totalQuestions =
          Number(state.totalQuestions);


        console.log(
          "TOTAL QUESTIONS FROM GAME STATE:",
          totalQuestions
        );

      }


      /*
        DO NOT DO THIS:

        currentQuestionNumber =
          state.currentQuestionNumber;

        That was causing the official question number
        to appear in the top counter.
      */


      updateQuestionCounter();

    });


    /* =====================================================
       QUESTION DATABASE UPDATED
       
       This should be emitted by the server whenever
       questions are added/deleted.
    ===================================================== */

    socket.on("questionsUpdated", async () => {

      console.log(
        "QUESTION DATABASE UPDATED"
      );


      /*
        Reload only the TOTAL.

        We do NOT touch questions[] because those are
        questions already read during the current game.
      */

      await loadTotalQuestions();


      updateQuestionCounter();

    });


    /* =====================================================
       GAME RESET
    ===================================================== */

    socket.on("gameReset", async () => {

      console.log(
        "QUESTION KEY RESET"
      );


      /*
        Clear questions that were read during the
        previous game.
      */

      questions.length = 0;


      /*
        Clear duplicate protection.
      */

      seenQuestionIds.clear();


      /*
        Reload the database total.

        The database questions are NOT deleted simply
        because the game was reset.
      */

      await loadTotalQuestions();


      /*
        Counter becomes:

        0/91
      */

      updateQuestionCounter();


      renderQuestions();

    });


    /* =====================================================
       GAME ENDED
    ===================================================== */

    socket.on("gameEnded", (data) => {

      console.log(
        "QUESTION KEY GAME ENDED:",
        data
      );


      updateQuestionCounter();

    });


    /* =====================================================
       NEW QUESTION
       
       THIS IS THE IMPORTANT PART.
    ===================================================== */

    socket.on(
      "cheatSheetQuestion",
      (question) => {

        console.log(
          "QUESTION RECEIVED:",
          question
        );


        if (!question) {
          return;
        }


        /* =================================================
           TOTAL QUESTIONS
        ================================================= */

        /*
          If the server provides totalQuestions,
          use it.

          Otherwise keep the value from /api/questions.
        */

        if (
          Number.isFinite(
            Number(question.totalQuestions)
          )
        ) {

          totalQuestions =
            Number(question.totalQuestions);

        }


        /* =================================================
           DUPLICATE PROTECTION
        ================================================= */

        /*
          Use the database ID ONLY to determine whether
          this exact question has already been received.

          The ID does NOT control the counter.
        */

        const questionID =
          question.id ??
          question.questionID;


        if (questionID !== undefined) {

          if (
            seenQuestionIds.has(questionID)
          ) {

            console.log(
              "DUPLICATE QUESTION IGNORED:",
              questionID
            );


            updateQuestionCounter();


            renderQuestions();


            return;
          }


          seenQuestionIds.add(
            questionID
          );

        }


        /* =================================================
           ADD QUESTION TO QUESTIONS READ
           
           THIS is what changes:

           0/91 → 1/91
           1/91 → 2/91
           2/91 → 3/91
        ================================================= */

        questions.push(
          question
        );


        console.log(
          "QUESTIONS READ:",
          questions.length
        );


        /* =================================================
           RENDER
        ================================================= */

        renderQuestions();

      }
    );


    /* =====================================================
       INITIALIZATION
    ===================================================== */

    /*
      Initial counter:

      0/0

      It will become:

      0/91

      after the database loads.
    */

    updateQuestionCounter();


    /*
      Load total immediately.
    */

    loadTotalQuestions();


    /*
      Initial connection status.
    */

    setConnectionStatus(
      "Connecting to game server...",
      "connecting"
    );

  </script>

</body>
</html>
