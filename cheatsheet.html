<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Question Key</title>

  <style>
    /* =====================================================
       GLOBAL
    ===================================================== */

    body {
      background: #101820;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }

    /* =====================================================
       QUESTION COUNTER
    ===================================================== */

    #questionCounter {
      text-align: center;
      color: #00ff66;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    /* =====================================================
       QUESTION LIST
    ===================================================== */

    #questionList {
      max-width: 900px;
      margin: auto;
    }

    .question {
      background: #222222;
      margin: 15px 0;
      padding: 20px;
      border-left: 6px solid #555555;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .question.current {
      background: #1c4424;
      border-left: 8px solid #00ff66;
    }

    .number {
      color: #FFD700;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .answer {
      color: #8cff8c;
      margin-top: 15px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #aaaaaa;
      font-size: 20px;
      margin-top: 40px;
    }

    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    .connection {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      z-index: 9999;
      background: #ffc107;
      color: #212529;
    }

    .connection.hidden {
      display: none;
    }

    .connection.connected {
      background: #28a745;
      color: #ffffff;
    }

    .connection.disconnected {
      background: #dc3545;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      #questionCounter {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .question {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       CONNECTION STATUS
  ===================================================== -->

  <div id="connectionStatus" class="connection">
    Connecting to game server...
  </div>

  <!-- =====================================================
       HEADER
  ===================================================== -->

  <h1>Live Game Question Key</h1>

  <!--
    This will display:

    Question 1 / 25
    Question 2 / 25
    Question 3 / 25

    etc.
  -->

  <div id="questionCounter">
    Question 0 / 0
  </div>

  <!-- =====================================================
       QUESTION LIST
  ===================================================== -->

  <div id="questionList">
    <div class="status">
      Waiting for game...
    </div>
  </div>


  <!-- =====================================================
       SOCKET.IO CLIENT
  ===================================================== -->

  <script src="/socket.io/socket.io.js"></script>

  <script>
    "use strict";

    console.log("LIVE QUESTION KEY LOADED");


    /* =====================================================
       DOM REFERENCES
    ===================================================== */

    const container =
      document.getElementById("questionList");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const questionCounter =
      document.getElementById("questionCounter");


    /* =====================================================
       STATE
    ===================================================== */

    let questions = [];

    const seenQuestionIds = new Set();

    /*
      Current question position.

      Example:

      Question 1 / 25
             ^
             |
      currentQuestionNumber = 1
    */

    let currentQuestionNumber = 0;


    /*
      Total number of questions in the system.

      Example:

      Question 1 / 25
                   ^
                   |
             totalQuestions = 25
    */

    let totalQuestions = 0;


    /* =====================================================
       UPDATE QUESTION COUNTER
    ===================================================== */

    function updateQuestionCounter() {

      if (!questionCounter) {
        return;
      }

      /*
        If we know the current question but not the total,
        still show the current question.

        Otherwise show 0 / 0 while waiting.
      */

      if (
        currentQuestionNumber > 0 &&
        totalQuestions > 0
      ) {

        questionCounter.textContent =
          `Question ${currentQuestionNumber} / ${totalQuestions}`;

        return;
      }

      /*
        If we know the current question but total is
        temporarily unavailable.
      */

      if (currentQuestionNumber > 0) {

        questionCounter.textContent =
          `Question ${currentQuestionNumber} / ${totalQuestions || "?"}`;

        return;
      }

      /*
        Nothing known yet.
      */

      questionCounter.textContent =
        "Question 0 / 0";
    }


    /* =====================================================
       LOAD TOTAL QUESTIONS FROM DATABASE
    ===================================================== */

    async function loadTotalQuestions() {

      console.log(
        "LOADING TOTAL QUESTIONS FROM /api/questions..."
      );

      try {

        const response =
          await fetch("/api/questions", {
            method: "GET",
            cache: "no-store"
          });

        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );
        }

        const allQuestions =
          await response.json();

        if (Array.isArray(allQuestions)) {

          totalQuestions =
            allQuestions.length;

          console.log(
            "TOTAL QUESTIONS IN SYSTEM:",
            totalQuestions
          );

          updateQuestionCounter();

        } else {

          console.error(
            "API /api/questions DID NOT RETURN AN ARRAY:",
            allQuestions
          );
        }

      } catch (error) {

        console.error(
          "FAILED TO LOAD TOTAL QUESTIONS:",
          error
        );
      }
    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    function setConnectionStatus(message, state) {

      if (!connectionStatus) {
        return;
      }

      connectionStatus.textContent = message;

      connectionStatus.className =
        "connection";

      if (state) {
        connectionStatus.classList.add(state);
      }
    }


    /* =====================================================
       RENDER QUESTIONS
    ===================================================== */

    function renderQuestions() {

      if (!container) {
        return;
      }

      container.replaceChildren();


      /*
        No questions yet.
      */

      if (questions.length === 0) {

        const statusDiv =
          document.createElement("div");

        statusDiv.className = "status";

        statusDiv.textContent =
          "Waiting for game...";

        container.appendChild(statusDiv);

        return;
      }


      const fragment =
        document.createDocumentFragment();


      questions.forEach((item, index) => {

        const div =
          document.createElement("div");


        /*
          The newest question is the current question.
        */

        div.className =
          "question" +
          (
            index === questions.length - 1
              ? " current"
              : ""
          );


        /*
          Display the actual question position.

          Prefer:

          currentQuestionNumber

          then:

          questionPosition

          then:

          number

          then:

          array position + 1
        */

        let number =
          item.currentQuestionNumber;

        if (
          !Number.isFinite(Number(number))
        ) {

          number =
            item.questionPosition;
        }

        if (
          !Number.isFinite(Number(number))
        ) {

          number =
            item.number;
        }

        if (
          !Number.isFinite(Number(number))
        ) {

          number =
            index + 1;
        }


        number =
          Number(number);


        /* =================================================
           QUESTION NUMBER
        ================================================= */

        const numberDiv =
          document.createElement("div");

        numberDiv.className =
          "number";

        numberDiv.textContent =
          `Question #${number}`;


        /* =================================================
           QUESTION TEXT
        ================================================= */

        const textDiv =
          document.createElement("div");

        textDiv.textContent =
          item.question ??
          item.q ??
          "";


        /* =================================================
           ANSWER
        ================================================= */

        const answerDiv =
          document.createElement("div");

        answerDiv.className =
          "answer";

        answerDiv.textContent =
          `Answer: ${
            item.answer ??
            item.a ??
            ""
          }`;


        /* =================================================
           ADD TO QUESTION
        ================================================= */

        div.append(
          numberDiv,
          textDiv,
          answerDiv
        );

        fragment.appendChild(div);

      });


      container.appendChild(fragment);


      /*
        Scroll to the newest question.
      */

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }


    /* =====================================================
       SOCKET.IO
    ===================================================== */

    const socket =
      io(window.location.origin, {

        transports: [
          "polling",
          "websocket"
        ],

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 1000,

        reconnectionDelayMax: 5000

      });


    /* =====================================================
       SOCKET CONNECTED
    ===================================================== */

    socket.on("connect", async () => {

      console.log(
        "QUESTION KEY CONNECTED:",
        socket.id
      );

      setConnectionStatus(
        "Connected to Game Server",
        "connected"
      );


      /*
        IMPORTANT:

        Get the total number of questions directly
        from the database/API.

        This means the page can know:

        Question X / 25

        even if the Socket.IO event doesn't include
        totalQuestions.
      */

      await loadTotalQuestions();


      /*
        Hide connection banner after 2 seconds.
      */

      setTimeout(() => {

        if (socket.connected) {

          connectionStatus.classList.add(
            "hidden"
          );
        }

      }, 2000);

    });


    /* =====================================================
       SOCKET DISCONNECTED
    ===================================================== */

    socket.on("disconnect", (reason) => {

      console.warn(
        "QUESTION KEY DISCONNECTED:",
        reason
      );

      setConnectionStatus(
        "Disconnected — Reconnecting...",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET CONNECTION ERROR
    ===================================================== */

    socket.on("connect_error", (error) => {

      console.error(
        "QUESTION KEY CONNECTION ERROR:",
        error
      );

      setConnectionStatus(
        "Unable to connect to game server",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET RECONNECT
    ===================================================== */

    socket.io.on(
      "reconnect_attempt",
      (attempt) => {

        console.log(
          "QUESTION KEY RECONNECT ATTEMPT:",
          attempt
        );

        setConnectionStatus(
          "Reconnecting to game server...",
          "disconnected"
        );

      }
    );


    /* =====================================================
       GAME STATE
    ===================================================== */

    socket.on("gameState", (state) => {

      console.log(
        "QUESTION KEY GAME STATE:",
        state
      );

      if (!state) {
        return;
      }


      /*
        If the game server sends totalQuestions,
        use it.

        This overrides the API value because the game
        server may be using a specific question set.
      */

      if (
        Number.isFinite(
          Number(state.totalQuestions)
        )
      ) {

        totalQuestions =
          Number(state.totalQuestions);

        console.log(
          "TOTAL QUESTIONS FROM GAME STATE:",
          totalQuestions
        );
      }


      /*
        Get the current question number.
      */

      if (
        Number.isFinite(
          Number(state.currentQuestionNumber)
        )
      ) {

        currentQuestionNumber =
          Number(state.currentQuestionNumber);

        console.log(
          "CURRENT QUESTION FROM GAME STATE:",
          currentQuestionNumber
        );
      }


      updateQuestionCounter();

    });


    /* =====================================================
       GAME RESET
    ===================================================== */

    socket.on("gameReset", () => {

      console.log(
        "QUESTION KEY RESET"
      );


      questions.length = 0;

      seenQuestionIds.clear();

      currentQuestionNumber = 0;


      /*
        Reload the database count instead of automatically
        assuming the total is zero.

        This is important.

        Resetting the GAME does NOT necessarily mean
        deleting all questions from the database.
      */

      loadTotalQuestions();

      updateQuestionCounter();

      renderQuestions();

    });


    /* =====================================================
       GAME ENDED
    ===================================================== */

    socket.on("gameEnded", (data) => {

      console.log(
        "QUESTION KEY GAME ENDED:",
        data
      );

      updateQuestionCounter();

    });


    /* =====================================================
       NEW QUESTION
    ===================================================== */

    socket.on(
      "cheatSheetQuestion",
      (question) => {

        console.log(
          "QUESTION RECEIVED:",
          question
        );

        if (!question) {
          return;
        }


        /* =================================================
           TOTAL QUESTIONS
        ================================================= */

        /*
          If the server provides totalQuestions,
          use it.

          Otherwise we keep the number obtained from
          /api/questions.
        */

        if (
          Number.isFinite(
            Number(question.totalQuestions)
          )
        ) {

          totalQuestions =
            Number(question.totalQuestions);

        }


        /* =================================================
           CURRENT QUESTION NUMBER
        ================================================= */

        /*
          IMPORTANT:

          currentQuestionNumber should be the POSITION
          in the game.

          Example:

          Question 1 / 25
          Question 2 / 25
          Question 3 / 25

          It should NOT necessarily be the database ID.
        */

        if (
          Number.isFinite(
            Number(question.currentQuestionNumber)
          )
        ) {

          currentQuestionNumber =
            Number(question.currentQuestionNumber);

        } else if (
          Number.isFinite(
            Number(question.questionPosition)
          )
        ) {

          currentQuestionNumber =
            Number(question.questionPosition);

        }


        /*
          Update the large counter.
        */

        updateQuestionCounter();


        /* =================================================
           DUPLICATE QUESTION PROTECTION
        ================================================= */

        /*
          Use the database ID to identify duplicates.

          Do NOT use the database ID as the question
          position.
        */

        const questionID =
          question.id ??
          question.questionID;


        if (questionID !== undefined) {

          if (
            seenQuestionIds.has(questionID)
          ) {

            console.log(
              "DUPLICATE QUESTION IGNORED:",
              questionID
            );

            renderQuestions();

            return;
          }


          seenQuestionIds.add(questionID);
        }


        /* =================================================
           ADD QUESTION
        ================================================= */

        questions.push(question);


        /* =================================================
           RENDER
        ================================================= */

        renderQuestions();

      }
    );


    /* =====================================================
       INITIALIZATION
    ===================================================== */

    /*
      Show 0 / 0 immediately.
    */

    updateQuestionCounter();


    /*
      Start loading the total immediately.

      This means the counter can become:

      Question 0 / 25

      before the game starts.
    */

    loadTotalQuestions();


    /*
      Show connection status.
    */

    setConnectionStatus(
      "Connecting to game server...",
      "connecting"
    );

  </script>

</body>
</html>
