<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Live Question Key</title>


<style>

body{

    background:#101820;
    color:white;
    font-family:Arial;
    padding:30px;

}


h1{

    color:#FFD700;

}


.question{

    background:#222;
    margin:15px 0;
    padding:20px;

    border-left:6px solid #555;

    border-radius:10px;

}


.current{

    background:#1c4424;

    border-left:8px solid #00ff66;

}


.number{

    color:#FFD700;

    font-size:20px;

    font-weight:bold;

}


.answer{

    color:#8cff8c;

    margin-top:10px;

    font-weight:bold;

}


</style>

</head>


<body>


<h1>
Live Game Question Key
</h1>


<div id="questionList">

Waiting for game...

</div>



<script src="/socket.io/socket.io.js"></script>

<script>
    
const socket = io();


let questions = [];


const container =
document.getElementById(
    "questionList"
);



socket.on(
"gameReset",
()=>{


    questions = [];


    container.innerHTML =
    "Waiting for game...";


});





socket.on(
"cheatSheetQuestion",
(q)=>{


    if(!q){

        return;

    }



    questions.push(q);



    container.innerHTML = "";



    questions.forEach(
    (item,index)=>{


        container.innerHTML += `

        <div class="question ${index === questions.length - 1 ? "current" : ""}">


            <div class="number">

                Question #${index + 1}

            </div>


            <div>

                ${item.question}

            </div>


            <div class="answer">

                Answer: ${item.answer}

            </div>


        </div>

        `;


    });


});

<script>

</body>

</html>
