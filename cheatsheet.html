<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Live Question Key</title>

  <style>
    /* =====================================================
       GLOBAL
    ===================================================== */

    body {
      background: #101820;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }


    /* =====================================================
       QUESTION COUNTER
    ===================================================== */

    #questionCounter {
      text-align: center;
      color: #00ff66;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }


    /* =====================================================
       QUESTION LIST
    ===================================================== */

    #questionList {
      max-width: 900px;
      margin: auto;
    }

    .question {
      background: #222222;
      margin: 15px 0;
      padding: 20px;
      border-left: 6px solid #555555;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .question.current {
      background: #1c4424;
      border-left: 8px solid #00ff66;
    }


    /* =====================================================
       QUESTION NUMBER
    ===================================================== */

    .number {
      color: #FFD700;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }


    /* =====================================================
       ANSWER
    ===================================================== */

    .answer {
      color: #8cff8c;
      margin-top: 15px;
      font-weight: bold;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {
      text-align: center;
      color: #aaaaaa;
      font-size: 20px;
      margin-top: 40px;
    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    .connection {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      z-index: 9999;

      background: #ffc107;
      color: #212529;
    }

    .connection.hidden {
      display: none;
    }

    .connection.connected {
      background: #28a745;
      color: #ffffff;
    }

    .connection.disconnected {
      background: #dc3545;
      color: #ffffff;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      #questionCounter {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .question {
        padding: 16px;
      }

    }
  </style>
</head>


<body>


  <!-- =====================================================
       CONNECTION STATUS
  ===================================================== -->

  <div id="connectionStatus" class="connection">
    Connecting to game server...
  </div>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <h1>Live Game Question Key</h1>


  <!-- =====================================================
       CURRENT GAME QUESTION
       
       Example:
       
       1/91
       2/91
       3/91
       
       etc.
       ===================================================== -->

  <div id="questionCounter">
    0/0
  </div>


  <!-- =====================================================
       QUESTION LIST
       ===================================================== -->

  <div id="questionList">

    <div class="status">
      Waiting for game...
    </div>

  </div>


  <!-- =====================================================
       SOCKET.IO
       ===================================================== -->

  <script src="/socket.io/socket.io.js"></script>


  <script>
    "use strict";

    console.log("LIVE QUESTION KEY LOADED");


    /* =====================================================
       DOM REFERENCES
       ===================================================== */

    const container =
      document.getElementById("questionList");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const questionCounter =
      document.getElementById("questionCounter");


    /* =====================================================
       STATE
       ===================================================== */

    let questions = [];

    /*
      Used to prevent the same question from being
      displayed more than once.
    */
    const seenQuestionIds = new Set();


    /*
      Current position in the game.

      Example:

      1/91
      2/91
      3/91
    */

    let currentQuestionNumber = 0;


    /*
      Total number of questions currently stored.

      Example:

      91
    */

    let totalQuestions = 0;


    /* =====================================================
       UPDATE QUESTION COUNTER
       ===================================================== */

    function updateQuestionCounter() {

      if (!questionCounter) {
        return;
      }


      /*
        Current game position / current total.
      */

      if (currentQuestionNumber > 0) {

        questionCounter.textContent =
          `${currentQuestionNumber}/${totalQuestions || "?"}`;

        return;
      }


      /*
        Game has not started yet.
      */

      questionCounter.textContent =
        `0/${totalQuestions || 0}`;
    }


    /* =====================================================
       LOAD TOTAL QUESTIONS FROM DATABASE
       ===================================================== */

    async function loadTotalQuestions() {

      console.log(
        "LOADING TOTAL QUESTIONS FROM /api/questions..."
      );


      try {

        const response =
          await fetch("/api/questions", {
            method: "GET",
            cache: "no-store"
          });


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const allQuestions =
          await response.json();


        if (Array.isArray(allQuestions)) {

          totalQuestions =
            allQuestions.length;


          console.log(
            "TOTAL QUESTIONS IN DATABASE:",
            totalQuestions
          );


          updateQuestionCounter();


        } else {

          console.error(
            "API /api/questions DID NOT RETURN AN ARRAY:",
            allQuestions
          );

        }


      } catch (error) {

        console.error(
          "FAILED TO LOAD TOTAL QUESTIONS:",
          error
        );

      }

    }


    /* =====================================================
       CONNECTION STATUS
       ===================================================== */

    function setConnectionStatus(message, state) {

      if (!connectionStatus) {
        return;
      }


      connectionStatus.textContent =
        message;


      connectionStatus.className =
        "connection";


      if (state) {

        connectionStatus.classList.add(
          state
        );

      }

    }


    /* =====================================================
       GET OFFICIAL QUESTION NUMBER
       ===================================================== */

    function getOfficialQuestionNumber(item) {

      /*
        IMPORTANT:

        question_number is the preferred permanent
        question number.

        This should be a number that does NOT change
        when questions are added or deleted.

        Example:

        question_number: 37
      */

      if (
        item.question_number !== undefined &&
        item.question_number !== null &&
        item.question_number !== ""
      ) {

        return item.question_number;

      }


      /*
        Alternative naming.
      */

      if (
        item.questionNumber !== undefined &&
        item.questionNumber !== null &&
        item.questionNumber !== ""
      ) {

        return item.questionNumber;

      }


      /*
        If the database does not have a dedicated
        question_number field, use the database ID.

        IMPORTANT:

        The database ID is NOT the game position.
      */

      if (
        item.id !== undefined &&
        item.id !== null
      ) {

        return item.id;

      }


      if (
        item.questionID !== undefined &&
        item.questionID !== null
      ) {

        return item.questionID;

      }


      /*
        Last fallback.
      */

      return "?";
    }


    /* =====================================================
       RENDER QUESTIONS
       ===================================================== */

    function renderQuestions() {

      if (!container) {
        return;
      }


      container.replaceChildren();


      /*
        No questions yet.
      */

      if (questions.length === 0) {

        const statusDiv =
          document.createElement("div");


        statusDiv.className =
          "status";


        statusDiv.textContent =
          "Waiting for game...";


        container.appendChild(
          statusDiv
        );


        return;
      }


      const fragment =
        document.createDocumentFragment();


      questions.forEach((item, index) => {


        /* =================================================
           CREATE QUESTION CONTAINER
           ================================================= */

        const div =
          document.createElement("div");


        /*
          The newest question is the current question.
        */

        div.className =
          "question" +
          (
            index === questions.length - 1
              ? " current"
              : ""
          );


        /* =================================================
           GAME POSITION
           =================================================

           This is NOT the official question number.

           It represents where the question is in the
           current game.

           Example:

           1/91
           2/91
           3/91
        */

        const gamePosition =
          index + 1;


        /* =================================================
           OFFICIAL QUESTION NUMBER
           =================================================

           This remains attached to the actual question.

           Example:

           Question #37
        */

        const officialNumber =
          getOfficialQuestionNumber(item);


        /* =================================================
           QUESTION NUMBER DISPLAY
           ================================================= */

        const numberDiv =
          document.createElement("div");


        numberDiv.className =
          "number";


        numberDiv.textContent =
          `${gamePosition}/${totalQuestions || "?"} — Question #${officialNumber}`;


        /* =================================================
           QUESTION TEXT
           ================================================= */

        const textDiv =
          document.createElement("div");


        textDiv.textContent =
          item.question ??
          item.q ??
          "";


        /* =================================================
           ANSWER
           ================================================= */

        const answerDiv =
          document.createElement("div");


        answerDiv.className =
          "answer";


        answerDiv.textContent =
          `Answer: ${
            item.answer ??
            item.a ??
            ""
          }`;


        /* =================================================
           ADD ELEMENTS
           ================================================= */

        div.append(
          numberDiv,
          textDiv,
          answerDiv
        );


        fragment.appendChild(
          div
        );

      });


      container.appendChild(
        fragment
      );


      /* =====================================================
         SCROLL TO CURRENT QUESTION
         ===================================================== */

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    }


    /* =====================================================
       SOCKET.IO CONNECTION
       ===================================================== */

    const socket =
      io(window.location.origin, {

        transports: [
          "polling",
          "websocket"
        ],

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 1000,

        reconnectionDelayMax: 5000

      });


    /* =====================================================
       SOCKET CONNECTED
       ===================================================== */

    socket.on("connect", async () => {

      console.log(
        "QUESTION KEY CONNECTED:",
        socket.id
      );


      setConnectionStatus(
        "Connected to Game Server",
        "connected"
      );


      /*
        Get the current total from the database.
      */

      await loadTotalQuestions();


      /*
        Hide connection banner after 2 seconds.
      */

      setTimeout(() => {

        if (socket.connected) {

          connectionStatus.classList.add(
            "hidden"
          );

        }

      }, 2000);

    });


    /* =====================================================
       SOCKET DISCONNECTED
       ===================================================== */

    socket.on("disconnect", (reason) => {

      console.warn(
        "QUESTION KEY DISCONNECTED:",
        reason
      );


      setConnectionStatus(
        "Disconnected — Reconnecting...",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET CONNECTION ERROR
       ===================================================== */

    socket.on("connect_error", (error) => {

      console.error(
        "QUESTION KEY CONNECTION ERROR:",
        error
      );


      setConnectionStatus(
        "Unable to connect to game server",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET RECONNECT
       ===================================================== */

    socket.io.on(
      "reconnect_attempt",
      (attempt) => {

        console.log(
          "QUESTION KEY RECONNECT ATTEMPT:",
          attempt
        );


        setConnectionStatus(
          "Reconnecting to game server...",
          "disconnected"
        );

      }
    );


    /* =====================================================
       GAME STATE
       ===================================================== */

    socket.on("gameState", (state) => {

      console.log(
        "QUESTION KEY GAME STATE:",
        state
      );


      if (!state) {
        return;
      }


      /* =================================================
         TOTAL QUESTIONS
         ================================================= */

      if (
        Number.isFinite(
          Number(state.totalQuestions)
        )
      ) {

        totalQuestions =
          Number(state.totalQuestions);


        console.log(
          "TOTAL QUESTIONS FROM GAME STATE:",
          totalQuestions
        );

      }


      /* =================================================
         CURRENT GAME POSITION
         ================================================= */

      if (
        Number.isFinite(
          Number(state.currentQuestionNumber)
        )
      ) {

        currentQuestionNumber =
          Number(state.currentQuestionNumber);


        console.log(
          "CURRENT GAME POSITION:",
          currentQuestionNumber
        );

      }


      updateQuestionCounter();

    });


    /* =====================================================
       QUESTION LIST UPDATED
       
       The server can emit this whenever a question is
       added, removed, or deleted.
       ===================================================== */

    socket.on("questionsUpdated", async () => {

      console.log(
        "QUESTION DATABASE UPDATED — RELOADING TOTAL"
      );


      await loadTotalQuestions();


      updateQuestionCounter();


      renderQuestions();

    });


    /* =====================================================
       GAME RESET
       ===================================================== */

    socket.on("gameReset", async () => {

      console.log(
        "QUESTION KEY RESET"
      );


      questions.length = 0;


      seenQuestionIds.clear();


      currentQuestionNumber = 0;


      /*
        The questions still exist in the database,
        so reload the database count.
      */

      await loadTotalQuestions();


      updateQuestionCounter();


      renderQuestions();

    });


    /* =====================================================
       GAME ENDED
       ===================================================== */

    socket.on("gameEnded", (data) => {

      console.log(
        "QUESTION KEY GAME ENDED:",
        data
      );


      updateQuestionCounter();

    });


    /* =====================================================
       NEW QUESTION
       ===================================================== */

    socket.on(
      "cheatSheetQuestion",
      (question) => {

        console.log(
          "QUESTION RECEIVED:",
          question
        );


        if (!question) {
          return;
        }


        /* =================================================
           TOTAL QUESTIONS
           ================================================= */

        /*
          If the server sends totalQuestions,
          use it.

          Otherwise retain the value loaded from
          /api/questions.
        */

        if (
          Number.isFinite(
            Number(question.totalQuestions)
          )
        ) {

          totalQuestions =
            Number(question.totalQuestions);

        }


        /* =================================================
           CURRENT GAME POSITION
           ================================================= */

        /*
          This is the GAME position.

          Example:

          1/91
          2/91
          3/91

          It is NOT the database ID.
        */

        if (
          Number.isFinite(
            Number(question.currentQuestionNumber)
          )
        ) {

          currentQuestionNumber =
            Number(question.currentQuestionNumber);

        } else if (
          Number.isFinite(
            Number(question.questionPosition)
          )
        ) {

          currentQuestionNumber =
            Number(question.questionPosition);

        }


        /* =================================================
           UPDATE BIG COUNTER
           ================================================= */

        updateQuestionCounter();


        /* =================================================
           DUPLICATE PROTECTION
           ================================================= */

        /*
          Use database ID to identify the question.

          NEVER use this as the game position.
        */

        const questionID =
          question.id ??
          question.questionID;


        if (questionID !== undefined) {

          if (
            seenQuestionIds.has(questionID)
          ) {

            console.log(
              "DUPLICATE QUESTION IGNORED:",
              questionID
            );


            renderQuestions();


            return;

          }


          seenQuestionIds.add(
            questionID
          );

        }


        /* =================================================
           ADD QUESTION TO LIVE LIST
           ================================================= */

        questions.push(
          question
        );


        /* =================================================
           RENDER
           ================================================= */

        renderQuestions();

      }
    );


    /* =====================================================
       INITIALIZATION
       ===================================================== */

    /*
      Show 0/0 immediately.
    */

    updateQuestionCounter();


    /*
      Load the current number of questions immediately.

      This can result in:

      0/91

      before the game starts.
    */

    loadTotalQuestions();


    /*
      Show connection status.
    */

    setConnectionStatus(
      "Connecting to game server...",
      "connecting"
    );

  </script>

</body>
</html>
