<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Live Question Key</title>

  <style>
    /* =====================================================
       GLOBAL
    ===================================================== */

    body {
      background: #101820;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px;
      margin: 0;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      margin-bottom: 10px;
    }


    /* =====================================================
       QUESTION COUNTER
       This is the large 1/91, 2/91, 3/91 display
    ===================================================== */

    #questionCounter {
      text-align: center;
      color: #00ff66;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }


    /* =====================================================
       QUESTION LIST
    ===================================================== */

    #questionList {
      max-width: 900px;
      margin: auto;
    }

    .question {
      background: #222222;
      margin: 15px 0;
      padding: 20px;
      border-left: 6px solid #555555;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .question.current {
      background: #1c4424;
      border-left: 8px solid #00ff66;
    }

    .number {
      color: #FFD700;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .answer {
      color: #8cff8c;
      margin-top: 15px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #aaaaaa;
      font-size: 20px;
      margin-top: 40px;
    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    .connection {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      z-index: 9999;

      background: #ffc107;
      color: #212529;
    }

    .connection.hidden {
      display: none;
    }

    .connection.connected {
      background: #28a745;
      color: #ffffff;
    }

    .connection.disconnected {
      background: #dc3545;
      color: #ffffff;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      #questionCounter {
        font-size: 26px;
        margin-bottom: 20px;
      }

      .question {
        padding: 16px;
      }

    }
  </style>
</head>


<body>


  <!-- =====================================================
       CONNECTION STATUS
    ===================================================== -->

  <div id="connectionStatus" class="connection">
    Connecting to game server...
  </div>


  <!-- =====================================================
       HEADER
    ===================================================== -->

  <h1>Live Game Question Key</h1>


  <!-- =====================================================
       LARGE GAME POSITION COUNTER

       THIS WILL SHOW:

       1/91
       2/91
       3/91

       It is NOT the official question number.
    ===================================================== -->

  <div id="questionCounter">
    0/0
  </div>


  <!-- =====================================================
       QUESTION LIST
    ===================================================== -->

  <div id="questionList">

    <div class="status">
      Waiting for game...
    </div>

  </div>


  <!-- =====================================================
       SOCKET.IO CLIENT
    ===================================================== -->

  <script src="/socket.io/socket.io.js"></script>


  <script>
    "use strict";

    console.log("LIVE QUESTION KEY LOADED");


    /* =====================================================
       DOM REFERENCES
    ===================================================== */

    const container =
      document.getElementById("questionList");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const questionCounter =
      document.getElementById("questionCounter");


    /* =====================================================
       STATE
    ===================================================== */

    let questions = [];

    /*
      Used to prevent duplicate questions.
    */

    const seenQuestionIds = new Set();


    /*
      This is the CURRENT GAME QUESTION POSITION.

      Example:

      1
      2
      3

      It is NOT the database ID.
      It is NOT the official question number.
    */

    let currentQuestionNumber = 0;


    /*
      Total number of questions currently stored
      in the database.

      Example:

      91
    */

    let totalQuestions = 0;


    /* =====================================================
       UPDATE LARGE QUESTION COUNTER
    ===================================================== */

    function updateQuestionCounter() {

      if (!questionCounter) {
        return;
      }


      /*
        THIS IS THE ONLY PLACE THAT CHANGES
        THE LARGE COUNTER.

        Example:

        1/91
        2/91
        3/91
      */

      if (currentQuestionNumber > 0) {

        questionCounter.textContent =
          `${currentQuestionNumber}/${totalQuestions || "?"}`;

        return;
      }


      /*
        Game has not started yet.
      */

      questionCounter.textContent =
        `0/${totalQuestions || 0}`;
    }


    /* =====================================================
       LOAD TOTAL QUESTIONS FROM DATABASE
    ===================================================== */

    async function loadTotalQuestions() {

      console.log(
        "LOADING TOTAL QUESTIONS FROM /api/questions..."
      );


      try {

        const response =
          await fetch("/api/questions", {
            method: "GET",
            cache: "no-store"
          });


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const allQuestions =
          await response.json();


        if (Array.isArray(allQuestions)) {

          totalQuestions =
            allQuestions.length;


          console.log(
            "TOTAL QUESTIONS IN DATABASE:",
            totalQuestions
          );


          updateQuestionCounter();

        } else {

          console.error(
            "API /api/questions DID NOT RETURN AN ARRAY:",
            allQuestions
          );

        }


      } catch (error) {

        console.error(
          "FAILED TO LOAD TOTAL QUESTIONS:",
          error
        );

      }

    }


    /* =====================================================
       CONNECTION STATUS
    ===================================================== */

    function setConnectionStatus(message, state) {

      if (!connectionStatus) {
        return;
      }


      connectionStatus.textContent =
        message;


      connectionStatus.className =
        "connection";


      if (state) {

        connectionStatus.classList.add(
          state
        );

      }

    }


    /* =====================================================
       RENDER QUESTIONS
    ===================================================== */

    function renderQuestions() {

      if (!container) {
        return;
      }


      container.replaceChildren();


      /*
        No questions yet.
      */

      if (questions.length === 0) {

        const statusDiv =
          document.createElement("div");


        statusDiv.className =
          "status";


        statusDiv.textContent =
          "Waiting for game...";


        container.appendChild(
          statusDiv
        );


        return;
      }


      const fragment =
        document.createDocumentFragment();


      questions.forEach((item, index) => {

        const div =
          document.createElement("div");


        /*
          The newest question is the current question.
        */

        div.className =
          "question" +
          (
            index === questions.length - 1
              ? " current"
              : ""
          );


        /* =================================================
           OFFICIAL QUESTION NUMBER

           KEEP THIS EXACTLY SEPARATE FROM THE
           1/91 COUNTER ABOVE.

           This is the number you use to identify
           the actual question in your question key.
        ================================================= */

        let number =
          item.currentQuestionNumber;


        if (
          !Number.isFinite(Number(number))
        ) {

          number =
            item.questionPosition;

        }


        if (
          !Number.isFinite(Number(number))
        ) {

          number =
            item.number;

        }


        if (
          !Number.isFinite(Number(number))
        ) {

          /*
            Final fallback.

            This does NOT affect the large 1/91 counter.
          */

          number =
            index + 1;

        }


        number =
          Number(number);


        /* =================================================
           OFFICIAL QUESTION NUMBER DISPLAY

           THIS STAYS:

           Question #37

           Question #52

           Question #91

           It does NOT become 1/91.
        ================================================= */

        const numberDiv =
          document.createElement("div");


        numberDiv.className =
          "number";


        numberDiv.textContent =
          `Question #${number}`;


        /* =================================================
           QUESTION TEXT
        ================================================= */

        const textDiv =
          document.createElement("div");


        textDiv.textContent =
          item.question ??
          item.q ??
          "";


        /* =================================================
           ANSWER
        ================================================= */

        const answerDiv =
          document.createElement("div");


        answerDiv.className =
          "answer";


        answerDiv.textContent =
          `Answer: ${
            item.answer ??
            item.a ??
            ""
          }`;


        /* =================================================
           ADD TO QUESTION
        ================================================= */

        div.append(
          numberDiv,
          textDiv,
          answerDiv
        );


        fragment.appendChild(
          div
        );

      });


      container.appendChild(
        fragment
      );


      /* =====================================================
         SCROLL TO NEWEST QUESTION
      ===================================================== */

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

    }


    /* =====================================================
       SOCKET.IO
    ===================================================== */

    const socket =
      io(window.location.origin, {

        transports: [
          "polling",
          "websocket"
        ],

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 1000,

        reconnectionDelayMax: 5000

      });


    /* =====================================================
       SOCKET CONNECTED
    ===================================================== */

    socket.on("connect", async () => {

      console.log(
        "QUESTION KEY CONNECTED:",
        socket.id
      );


      setConnectionStatus(
        "Connected to Game Server",
        "connected"
      );


      /*
        Load the current database total.

        Example:

        0/91
      */

      await loadTotalQuestions();


      /*
        Hide connection banner after 2 seconds.
      */

      setTimeout(() => {

        if (socket.connected) {

          connectionStatus.classList.add(
            "hidden"
          );

        }

      }, 2000);

    });


    /* =====================================================
       SOCKET DISCONNECTED
    ===================================================== */

    socket.on("disconnect", (reason) => {

      console.warn(
        "QUESTION KEY DISCONNECTED:",
        reason
      );


      setConnectionStatus(
        "Disconnected — Reconnecting...",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET CONNECTION ERROR
    ===================================================== */

    socket.on("connect_error", (error) => {

      console.error(
        "QUESTION KEY CONNECTION ERROR:",
        error
      );


      setConnectionStatus(
        "Unable to connect to game server",
        "disconnected"
      );

    });


    /* =====================================================
       SOCKET RECONNECT
    ===================================================== */

    socket.io.on(
      "reconnect_attempt",
      (attempt) => {

        console.log(
          "QUESTION KEY RECONNECT ATTEMPT:",
          attempt
        );


        setConnectionStatus(
          "Reconnecting to game server...",
          "disconnected"
        );

      }
    );


    /* =====================================================
       GAME STATE
    ===================================================== */

    socket.on("gameState", (state) => {

      console.log(
        "QUESTION KEY GAME STATE:",
        state
      );


      if (!state) {
        return;
      }


      /* =================================================
         TOTAL QUESTIONS
      ================================================= */

      if (
        Number.isFinite(
          Number(state.totalQuestions)
        )
      ) {

        totalQuestions =
          Number(state.totalQuestions);


        console.log(
          "TOTAL QUESTIONS FROM GAME STATE:",
          totalQuestions
        );

      }


      /* =================================================
         CURRENT GAME POSITION
         
         THIS controls the LARGE:

         1/91
         2/91
         3/91
      ================================================= */

      if (
        Number.isFinite(
          Number(state.currentQuestionNumber)
        )
      ) {

        currentQuestionNumber =
          Number(state.currentQuestionNumber);


        console.log(
          "CURRENT GAME QUESTION:",
          currentQuestionNumber
        );

      }


      updateQuestionCounter();

    });


    /* =====================================================
       GAME RESET
    ===================================================== */

    socket.on("gameReset", async () => {

      console.log(
        "QUESTION KEY RESET"
      );


      questions.length = 0;


      seenQuestionIds.clear();


      currentQuestionNumber = 0;


      /*
        Reset the game position.

        Do NOT assume there are zero questions
        in the database.
      */

      await loadTotalQuestions();


      updateQuestionCounter();


      renderQuestions();

    });


    /* =====================================================
       GAME ENDED
    ===================================================== */

    socket.on("gameEnded", (data) => {

      console.log(
        "QUESTION KEY GAME ENDED:",
        data
      );


      updateQuestionCounter();

    });


    /* =====================================================
       NEW QUESTION
    ===================================================== */

    socket.on(
      "cheatSheetQuestion",
      (question) => {

        console.log(
          "QUESTION RECEIVED:",
          question
        );


        if (!question) {
          return;
        }


        /* =================================================
           TOTAL QUESTIONS
        ================================================= */

        /*
          If the server sends the total, use it.

          Otherwise keep the number obtained from
          /api/questions.
        */

        if (
          Number.isFinite(
            Number(question.totalQuestions)
          )
        ) {

          totalQuestions =
            Number(question.totalQuestions);

        }


        /* =================================================
           CURRENT GAME QUESTION NUMBER
           
           THIS IS THE NUMBER USED FOR:

           1/91
           2/91
           3/91
        ================================================= */

        if (
          Number.isFinite(
            Number(question.currentQuestionNumber)
          )
        ) {

          currentQuestionNumber =
            Number(question.currentQuestionNumber);

        } else if (
          Number.isFinite(
            Number(question.questionPosition)
          )
        ) {

          currentQuestionNumber =
            Number(question.questionPosition);

        }


        /* =================================================
           UPDATE LARGE COUNTER

           Example:

           1/91
        ================================================= */

        updateQuestionCounter();


        /* =================================================
           DUPLICATE QUESTION PROTECTION
        ================================================= */

        /*
          Use database ID ONLY to identify duplicates.

          The database ID does NOT control the large
          question counter.
        */

        const questionID =
          question.id ??
          question.questionID;


        if (questionID !== undefined) {

          if (
            seenQuestionIds.has(questionID)
          ) {

            console.log(
              "DUPLICATE QUESTION IGNORED:",
              questionID
            );


            renderQuestions();


            return;

          }


          seenQuestionIds.add(
            questionID
          );

        }


        /* =================================================
           ADD QUESTION
        ================================================= */

        questions.push(
          question
        );


        /* =================================================
           RENDER QUESTION
           
           The question itself will still say:

           Question #37

           It will NOT say 1/91.
        ================================================= */

        renderQuestions();

      }
    );


    /* =====================================================
       INITIALIZATION
    ===================================================== */

    /*
      Initial display:

      0/0
    */

    updateQuestionCounter();


    /*
      Immediately find out how many questions
      are currently stored.

      Example:

      0/91
    */

    loadTotalQuestions();


    /*
      Show connection status.
    */

    setConnectionStatus(
      "Connecting to game server...",
      "connecting"
    );

  </script>

</body>
</html>
