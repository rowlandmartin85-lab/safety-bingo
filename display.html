<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Standdown Bingo - Display</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at top, #0b1b3a, #050914);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            text-align: center;
            overflow: hidden;
        }

        .display-container {
            width: 100%;
            max-width: 1600px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* 3D METALLIC GOLD TITLE HEADER LOGIC WITH CONTINUOUS SHINE */
        h1 {
            font-size: 82px; 
            font-weight: 900;
            margin: 0 0 35px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff3a1 0%, #ffd700 25%, #cca100 50%, #ffd700 75%, #fff3a1 100%);
            background-size: 200% auto;
            
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            
            animation: subtleGoldShine 6s linear infinite;
            
            filter: 
                drop-shadow(0 1px 0 #b39200)
                drop-shadow(0 2px 0 #997d00)
                drop-shadow(0 3px 0 #806800)
                drop-shadow(0 4px 2px rgba(0,0,0,0.6))
                drop-shadow(0 0 8px rgba(255,215,0,0.2));
        }

        @keyframes subtleGoldShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* UP-SCALED MAXIMIZED SIZE FOR HIGH-RESOLUTION PROJECTOR OUTPUT */
        #questionDisplay {
            font-size: 68px; 
            padding: 55px; 
            border-radius: 26px;
            background: rgba(255,255,255,0.08);
            border: 5px solid #22c55e; 
            box-shadow: 0 16px 45px rgba(0,0,0,0.6);
            min-height: 250px; 
            width: 100%;
            max-width: 1400px; 
            box-sizing: border-box;
            position: relative;
            line-height: 1.3;
            font-weight: bold;
        }

        /* TIMER STAGE BORDER COLORS */
        .timer-green { border-color: #22c55e !important; }
        .timer-amber { border-color: #fbbf24 !important; }
        .timer-orange { border-color: #f97316 !important; }
        .timer-red { border-color: #ef4444 !important; }
        .timer-dead { border-color: #7f1d1d !important; }

        /* CONSTANT 2.5-SECOND COLOR LOOP WAVE FOR IDLE PANEL BACKGROUND */
        .idle-cycle {
            animation: infiniteSweepingCycle 2.5s linear infinite;
        }

        @keyframes infiniteSweepingCycle {
            0% { border-color: #22c55e; }
            16% { border-color: #fbbf24; }
            33% { border-color: #f97316; }
            50% { border-color: #ef4444; }
            66% { border-color: #3b82f6; }
            83% { border-color: #a855f7; }
            100% { border-color: #22c55e; }
        }

        /* ========================================================
           WIN PRESENTATION FULL-SCREEN OVERLAY & CONFETTI SYSTEM
           ======================================================== */
        .bingo-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
        }

        .bingo-title {
            font-size: 110px;
            font-weight: 900;
            color: #FFD84D;
            text-shadow: 0 0 25px #FFD84D, 0 0 50px #ff9400;
            animation: overlayTitlePulse 1s ease-in-out infinite alternate;
            z-index: 10001;
            font-family: 'Arial Black', Impact, sans-serif;
            letter-spacing: 2px;
        }

        @keyframes overlayTitlePulse {
            from { transform: scale(0.95); filter: brightness(0.9); }
            to { transform: scale(1.05); filter: brightness(1.15); }
        }

        .bingo-sub {
            font-size: 36px;
            margin-top: 20px;
            z-index: 10001;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* Confetti particle acceleration properties */
        .confetti-flake {
            position: absolute;
            top: -20px;
            z-index: 10000;
            opacity: 1;
            border-radius: 3px;
            animation: particleTumble Fall linear forwards;
        }

        @keyframes particleTumbleFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="display-container">

    <h1>Safety Standdown Bingo</h1>

    <div id="questionDisplay" class="idle-cycle">
        Waiting for host to start...
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/audio.js"></script>

<script>
const socket = io();
const display = document.getElementById("questionDisplay");

let timer = { max: 30, current: 30, interval: null };

function startTimer(seconds = 30) {
    clearInterval(timer.interval);
    timer.max = seconds;
    timer.current = seconds;

    timer.interval = setInterval(() => {
        timer.current--;
        updateTimerUI();

        if (timer.current <= 0) {
            clearInterval(timer.interval);
            socket.emit("requestNext");
        }
    }, 1000);

    updateTimerUI();
}

function updateTimerUI() {
    display.classList.remove("timer-green", "timer-amber", "timer-orange", "timer-red", "timer-dead");
    let ratio = timer.current / timer.max;

    if (ratio > 0.75) display.classList.add("timer-green");
    else if (ratio > 0.5) display.classList.add("timer-amber");
    else if (ratio > 0.25) display.classList.add("timer-orange");
    else if (ratio > 0) display.classList.add("timer-red");
    else display.classList.add("timer-dead");
}

/* ========================================================
   HIGH-FIDELITY GRAVITY CONFETTI PARTICLE STREAM ENGINE
   ======================================================== */
function showBingoCelebOverlay() {
    const overlay = document.createElement("div");
    overlay.className = "bingo-overlay";

    overlay.innerHTML = `
        <div class="bingo-title">B I N G O !</div>
        <div class="bingo-sub">WIN CONFIRMED</div>
    `;

    document.body.appendChild(overlay);

    // Color node data array matching industry gaming standards
    const palette = ["#FFD84D", "#2ecc71", "#3498db", "#e74c3c", "#9b59b6", "#f1c40f", "#e67e22"];

    // Spawn 200 random independent colored flake containers
    for (let i = 0; i < 200; i++) {
        const flake = document.createElement("div");
        flake.className = "confetti-flake";

        const widthScale = Math.random() * 12 + 6;
        const heightScale = Math.random() * 12 + 6;

        flake.style.width = widthScale + "px";
        flake.style.height = heightScale + "px";
        flake.style.background = palette[Math.floor(Math.random() * palette.length)];
        
        // Distribute starting coordinates edge-to-edge horizontally
        flake.style.left = Math.random() * 100 + "vw";
        
        // Randomize drop duration between 2.5 and 5 seconds to create natural layered weight
        const individualDuration = 2.5 + Math.random() * 2.5;
        flake.style.animation = `particleTumbleFall ${individualDuration}s linear forwards`;
        
        // Shape randomization selector logic (50% circle ratio conversion)
        if (Math.random() > 0.5) {
            flake.style.borderRadius = "50%";
        }

        overlay.appendChild(flake);
    }

    if (window.audioEngine) {
        window.audioEngine.play("ding");
        window.audioEngine.speak("Bingo!");
    }

    // Cleanly wipe the particle container elements from DOM cache memory after cascade completes
    setTimeout(() => {
        overlay.remove();
    }, 5500);
}

// REAL-TIME COMMUNICATOR STATE HOOKS
socket.on("gameState", (state) => {
    if (!state || state.status === "idle" || state.status === "ended") {
        clearInterval(timer.interval);
        display.textContent = "Waiting for host to start...";
        display.classList.add("idle-cycle");
        display.classList.remove("timer-green", "timer-amber", "timer-orange", "timer-red", "timer-dead");

        if (state && state.status === "ended") {
            display.textContent = "Game Over";
            if (window.audioEngine) {
                window.audioEngine.play("end");
                window.audioEngine.speak("Game over. Thank you for playing Safety Standdown Bingo.");
            }
        }
        return;
    }

    if (state.status === "intro") {
        display.classList.remove("idle-cycle");
        display.textContent = "Get Ready!";
        if (window.audioEngine) {
            window.audioEngine.play("intro");
            window.audioEngine.speak("Welcome to Safety Standdown Bingo. Get ready for the training safety challenge system.");
        }
        return;
    }

     if (state.status === "running") {
        display.classList.remove("idle-cycle");
        display.textContent = state.currentQuestion || "";

        // Enunciate the active shuffled question text cleanly through presentation speakers
        if (window.audioEngine && state.currentQuestion) {
            window.audioEngine.play("whoosh");
            window.audioEngine.speak(state.currentQuestion);
        }

        startTimer(30); // 30-SECOND COUNTDOWN CLOCK FOR PROJECTOR TRACKS
        return;
    }
});

// CENTRALIZED WIN SECTOR APPROVED SIGNAL BROADCAST RECEIVER
socket.on("winApproved", () => {
    showBingoCelebOverlay();
});
</script>

</body>
</html>
