<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Safety Stand Down Bingo - Display
</title>


<style>

/* =====================================================
   GLOBAL RESET
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

}


/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #0b1b3a,
            #050914
        );

    color: white;

    width: 100vw;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

}


/* =====================================================
   MAIN DISPLAY CONTAINER
===================================================== */

.display-container {

    width: 100%;

    height: 100%;

    max-width: 1600px;

    padding: 40px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    font-size: 82px;

    font-weight: 900;

    margin: 0 0 35px;

    text-transform: uppercase;

    letter-spacing: 2px;

    background:
        linear-gradient(
            135deg,
            #fff3a1,
            #ffd700,
            #cca100,
            #ffd700,
            #fff3a1
        );

    background-size: 200% auto;

    -webkit-background-clip: text;

    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        goldShine 6s linear infinite;

    filter:
        drop-shadow(0 1px 0 #b39200)
        drop-shadow(0 2px 0 #997d00)
        drop-shadow(0 3px 0 #806800)
        drop-shadow(0 4px 5px rgba(0,0,0,.6));

}


@keyframes goldShine {

    0% {
        background-position: 0% center;
    }

    100% {
        background-position: 200% center;
    }

}


/* =====================================================
   QUESTION DISPLAY
===================================================== */

#questionDisplay {

    width: 100%;

    max-width: 1400px;

    min-height: 250px;

    padding: 55px;

    border-radius: 26px;

    background:
        rgba(
            255,
            255,
            255,
            .08
        );

    border:
        5px solid #22c55e;

    font-size: 68px;

    font-weight: bold;

    line-height: 1.3;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    overflow-wrap: break-word;

    word-wrap: break-word;

    hyphens: auto;

    transition:
        border-color .3s ease,
        box-shadow .3s ease;

    box-shadow:
        0 16px 45px rgba(0,0,0,.6);

}


/* =====================================================
   TIMER GREEN
===================================================== */

.timer-green {

    border-color:
        #22c55e !important;

    box-shadow:
        0 0 18px #22c55e,
        0 0 40px rgba(34,197,94,.8),
        0 0 70px rgba(34,197,94,.45),
        0 16px 45px rgba(0,0,0,.6) !important;

}


/* =====================================================
   TIMER AMBER
===================================================== */

.timer-amber {

    border-color:
        #fbbf24 !important;

    box-shadow:
        0 0 18px #fbbf24,
        0 0 40px rgba(251,191,36,.8),
        0 0 70px rgba(251,191,36,.45),
        0 16px 45px rgba(0,0,0,.6) !important;

}


/* =====================================================
   TIMER ORANGE
===================================================== */

.timer-orange {

    border-color:
        #f97316 !important;

    box-shadow:
        0 0 18px #f97316,
        0 0 40px rgba(249,115,22,.8),
        0 0 70px rgba(249,115,22,.45),
        0 16px 45px rgba(0,0,0,.6) !important;

}


/* =====================================================
   TIMER RED
===================================================== */

.timer-red {

    border-color:
        #ef4444 !important;

    box-shadow:
        0 0 18px #ef4444,
        0 0 40px rgba(239,68,68,.8),
        0 0 70px rgba(239,68,68,.45),
        0 16px 45px rgba(0,0,0,.6) !important;

}


/* =====================================================
   TIMER DEAD
===================================================== */

.timer-dead {

    border-color:
        #7f1d1d !important;

    box-shadow:
        0 0 18px #991b1b,
        0 0 40px rgba(153,27,27,.8),
        0 0 70px rgba(153,27,27,.45),
        0 16px 45px rgba(0,0,0,.6) !important;

}


/* =====================================================
   PAUSED
===================================================== */

.timer-paused {

    border-color:
        #22c55e !important;

    box-shadow:
        0 0 15px #22c55e,
        0 0 30px #15803d,
        0 16px 45px rgba(0,0,0,.6) !important;

}


/* =====================================================
   IDLE / WAITING MODE

   display.js controls the actual color.

   This class intentionally does NOT use
   a CSS animation because display.js
   performs the color sweep itself.
===================================================== */

.idle-waiting-mode {

    border-color:
        #22c55e;

    box-shadow:
        0 0 20px #22c55e,
        0 0 45px rgba(34,197,94,.85),
        0 0 75px rgba(34,197,94,.5),
        0 16px 45px rgba(0,0,0,.6);

}


/* =====================================================
   QUESTION TRANSITIONS
===================================================== */

.swoosh-out {

    opacity: .15;

    transform:
        translateX(-20px);

}


.prepare-in {

    opacity: .15;

    transform:
        translateX(20px);

}


.fade-in {

    opacity: 1;

    transform:
        translateX(0);

}


#questionDisplay {

    transition:
        border-color .3s ease,
        box-shadow .3s ease,
        opacity .3s ease,
        transform .3s ease;

}


/* =====================================================
   BINGO WINNER OVERLAY
===================================================== */

.bingo-overlay {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;

    background:
        rgba(0,0,0,.85);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 9999;

    overflow: hidden;

    padding: 20px;

}


.bingo-title {

    font-size: 110px;

    font-weight: 900;

    color:
        #FFD84D;

    text-shadow:
        0 0 25px #FFD84D,
        0 0 50px #ff9400;

    animation:
        bingoPulse 1s ease-in-out infinite alternate;

    font-family:
        Arial Black,
        Impact,
        Arial,
        sans-serif;

    letter-spacing: 2px;

}


.bingo-sub {

    font-size: 36px;

    margin-top: 20px;

    font-weight: bold;

    color: white;

}


.confetti-flake {

    position: absolute;

    top: -20px;

    z-index: 10000;

}


@keyframes bingoPulse {

    from {
        transform: scale(.95);
    }

    to {
        transform: scale(1.05);
    }

}


@keyframes confettiFall {

    from {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;

    }

    to {

        transform:
            translateY(105vh)
            rotate(720deg);

        opacity: 0;

    }

}


/* =====================================================
   LARGE DESKTOP / PROJECTOR
===================================================== */

@media (min-width: 1201px) {

    .display-container {

        padding: 40px;

    }

    h1 {

        font-size:
            clamp(
                56px,
                5vw,
                82px
            );

        margin-bottom: 35px;

    }

    #questionDisplay {

        font-size:
            clamp(
                42px,
                4.2vw,
                68px
            );

        padding:
            clamp(
                35px,
                4vw,
                55px
            );

        min-height: 250px;

        max-width: 1400px;

    }

}


/* =====================================================
   LAPTOP / SMALL DESKTOP
===================================================== */

@media
(min-width: 769px)
and
(max-width: 1200px) {

    .display-container {

        width: 100%;

        height: 100%;

        padding: 30px;

    }

    h1 {

        font-size:
            clamp(
                42px,
                6vw,
                64px
            );

        margin-bottom: 28px;

    }

    #questionDisplay {

        width: 100%;

        max-width: 1100px;

        min-height: 220px;

        padding: 35px;

        font-size:
            clamp(
                36px,
                5vw,
                56px
            );

        line-height: 1.25;

    }

}


/* =====================================================
   TABLET
===================================================== */

@media
(min-width: 481px)
and
(max-width: 768px) {

    .display-container {

        padding: 25px;

    }

    h1 {

        font-size:
            clamp(
                34px,
                7vw,
                52px
            );

        margin-bottom: 24px;

        letter-spacing: 1px;

    }

    #questionDisplay {

        width: 100%;

        max-width: 100%;

        min-height: 200px;

        padding: 28px 22px;

        font-size:
            clamp(
                30px,
                6vw,
                46px
            );

        line-height: 1.25;

        border-width: 4px;

        border-radius: 22px;

    }

    .bingo-title {

        font-size:
            clamp(
                65px,
                15vw,
                100px
            );

    }

    .bingo-sub {

        font-size:
            clamp(
                24px,
                5vw,
                36px
            );

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    html,
    body {

        width: 100%;

        height: 100%;

        min-height: 100dvh;

    }


    body {

        width: 100vw;

        height: 100dvh;

        min-height: 100dvh;

    }


    .display-container {

        width: 100%;

        height: 100dvh;

        min-height: 100dvh;

        padding: 16px;

        justify-content: center;

    }


    h1 {

        width: 100%;

        font-size:
            clamp(
                28px,
                9vw,
                42px
            );

        line-height: 1.05;

        margin:
            0 0 20px;

        letter-spacing: 1px;

    }


    #questionDisplay {

        width: 100%;

        max-width: 100%;

        min-height: 180px;

        padding:
            24px 16px;

        font-size:
            clamp(
                25px,
                7.5vw,
                38px
            );

        line-height: 1.2;

        border-width: 4px;

        border-radius: 18px;

        overflow-wrap: anywhere;

        word-break: normal;

    }


    .bingo-title {

        font-size:
            clamp(
                58px,
                18vw,
                90px
            );

        line-height: 1;

    }


    .bingo-sub {

        font-size:
            clamp(
                22px,
                6vw,
                32px
            );

        text-align: center;

        padding: 0 20px;

    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 360px) {

    .display-container {

        padding: 12px;

    }


    h1 {

        font-size: 28px;

        margin-bottom: 16px;

    }


    #questionDisplay {

        min-height: 155px;

        padding:
            20px 12px;

        font-size: 24px;

        border-radius: 16px;

    }


    .bingo-title {

        font-size: 55px;

    }


    .bingo-sub {

        font-size: 20px;

    }

}


/* =====================================================
   LANDSCAPE PHONES
===================================================== */

@media
(max-width: 900px)
and
(orientation: landscape) {

    .display-container {

        padding:
            12px 24px;

        justify-content: center;

    }


    h1 {

        font-size:
            clamp(
                28px,
                6vw,
                44px
            );

        margin-bottom: 12px;

    }


    #questionDisplay {

        min-height: 130px;

        padding:
            18px 24px;

        font-size:
            clamp(
                24px,
                4vw,
                40px
            );

    }

}


/* =====================================================
   BINGO OVERLAY RESPONSIVE
===================================================== */

.bingo-overlay {

    width: 100vw;

    height: 100dvh;

    padding: 20px;

}


.bingo-title,
.bingo-sub {

    max-width: 100%;

    text-align: center;

}


</style>

</head>


<body>


<div class="display-container">


    <h1>
        Safety Standdown Bingo
    </h1>


    <div
        id="questionDisplay"
        class="idle-waiting-mode"
    >
        Waiting for host to start...
    </div>


</div>


<!-- =====================================================
     SOCKET.IO
===================================================== -->

<script src="/socket.io/socket.io.js"></script>


<!-- =====================================================
     AUDIO ENGINE
===================================================== -->

<script src="/js/audio.js"></script>


<!-- =====================================================
     DISPLAY CONTROLLER

     IMPORTANT:
     All timer/game-state logic now lives here.
     Do NOT duplicate the socket/game-state code
     inside display.html.
===================================================== -->

<script src="/js/display.js"></script>


<!-- =====================================================
     BINGO WINNER CELEBRATION
===================================================== -->

<script>

(function () {

    "use strict";


    function showBingoCelebOverlay() {

        if (
            document.querySelector(
                ".bingo-overlay"
            )
        ) {

            return;

        }


        const overlay =
            document.createElement(
                "div"
            );


        overlay.className =
            "bingo-overlay";


        overlay.innerHTML = `

            <div class="bingo-title">
                B I N G O !
            </div>

            <div class="bingo-sub">
                WIN CONFIRMED
            </div>

        `;


        document.body.appendChild(
            overlay
        );


        const colors = [

            "#FFD84D",
            "#2ecc71",
            "#3498db",
            "#e74c3c",
            "#9b59b6",
            "#f1c40f",
            "#e67e22"

        ];


        for (
            let i = 0;
            i < 300;
            i++
        ) {

            const flake =
                document.createElement(
                    "div"
                );


            flake.className =
                "confetti-flake";


            const size =
                Math.random() * 14 + 6;


            flake.style.width =
                size + "px";


            flake.style.height =
                size + "px";


            flake.style.background =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            flake.style.left =
                Math.random() * 100 +
                "vw";


            const duration =
                5 +
                Math.random() * 5;


            flake.style.animation =
                `confettiFall ${duration}s linear forwards`;


            if (
                Math.random() > .5
            ) {

                flake.style.borderRadius =
                    "50%";

            }


            overlay.appendChild(
                flake
            );

        }


        if (
            window.audioEngine &&
            typeof window.audioEngine.speak ===
                "function"
        ) {

            window.audioEngine.speak(

                "Bingo! Winner confirmed.",

                {
                    rate: .8,
                    force: true
                }

            );

        }


        setTimeout(
            () => {

                overlay.remove();

            },
            10000
        );

    }


    /*
    =====================================================
    WIN APPROVAL
    =====================================================
    */

    if (
        typeof io ===
        "function"
    ) {

        const liveWebsiteAddressUrl =
            `${window.location.protocol}//${window.location.host}`;


        const bingoSocket =
            io(
                liveWebsiteAddressUrl
            );


        bingoSocket.on(
            "winApproved",
            () => {

                showBingoCelebOverlay();

            }
        );


        bingoSocket.on(
            "physicalWinApproved",
            () => {

                showBingoCelebOverlay();

            }
        );

    }


})();

</script>


</body>

</html>
