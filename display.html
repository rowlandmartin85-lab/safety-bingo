<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Safety Standdown Bingo - Display</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#0b1b3a,#050914);
color:white;
height:100vh;
width:100vw;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
text-align:center;
}


.display-container{
width:100%;
max-width:1600px;
padding:40px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-sizing:border-box;
}


/* TITLE */

h1{
font-size:82px;
font-weight:900;
margin:0 0 35px;
text-transform:uppercase;
letter-spacing:2px;
background:linear-gradient(135deg,#fff3a1,#ffd700,#cca100,#ffd700,#fff3a1);
background-size:200% auto;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
animation:goldShine 6s linear infinite;
filter:
drop-shadow(0 1px 0 #b39200)
drop-shadow(0 2px 0 #997d00)
drop-shadow(0 3px 0 #806800)
drop-shadow(0 4px 5px rgba(0,0,0,.6));
}


@keyframes goldShine{

0%{
background-position:0% center;
}

100%{
background-position:200% center;
}

}



/* QUESTION PANEL */

#questionDisplay{
font-size:68px;
padding:55px;
border-radius:26px;
min-height:250px;
width:100%;
max-width:1400px;
background:rgba(255,255,255,.08);
border:5px solid #22c55e;
box-shadow:0 16px 45px rgba(0,0,0,.6);
box-sizing:border-box;
font-weight:bold;
line-height:1.3;
display:flex;
justify-content:center;
align-items:center;
}


/* TIMER COLORS */

.timer-green{
border-color:#22c55e!important;
}

.timer-amber{
border-color:#fbbf24!important;
}

.timer-orange{
border-color:#f97316!important;
}

.timer-red{
border-color:#ef4444!important;
}

.timer-dead{
border-color:#7f1d1d!important;
}



/* IDLE COLOR CYCLE */

.idle-cycle{
animation:idleCycle 2.5s linear infinite;
}


@keyframes idleCycle{

0%{
border-color:#22c55e;
}

16%{
border-color:#fbbf24;
}

33%{
border-color:#f97316;
}

50%{
border-color:#ef4444;
}

66%{
border-color:#3b82f6;
}

83%{
border-color:#a855f7;
}

100%{
border-color:#22c55e;
}

}



/* BINGO OVERLAY */

.bingo-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
overflow:hidden;
}


.bingo-title{
font-size:110px;
font-weight:900;
color:#FFD84D;
text-shadow:
0 0 25px #FFD84D,
0 0 50px #ff9400;
animation:bingoPulse 1s ease-in-out infinite alternate;
font-family:Arial Black,Impact,sans-serif;
letter-spacing:2px;
}


.bingo-sub{
font-size:36px;
margin-top:20px;
font-weight:bold;
color:white;
}


.confetti-flake{
position:absolute;
top:-20px;
z-index:10000;
}


@keyframes bingoPulse{

from{
transform:scale(.95);
}

to{
transform:scale(1.05);
}

}


@keyframes confettiFall{

from{
transform:translateY(0) rotate(0deg);
opacity:1;
}

to{
transform:translateY(105vh) rotate(720deg);
opacity:0;
}

}

</style>

</head>

<body>

<div class="display-container">

<h1>
Safety Standdown Bingo
</h1>


<div id="questionDisplay" class="idle-cycle">
Waiting for host to start...
</div>

</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/js/audio.js"></script>

<body>

<div class="display-container">

<h1>Safety Standdown Bingo</h1>

<div id="questionDisplay" class="idle-cycle">
Waiting for host to start...
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/audio.js"></script>

<script>

const socket=io();
const display=document.getElementById("questionDisplay");

let timer={
max:30,
current:30,
interval:null
};

function clearTimer(){
clearInterval(timer.interval);
}

function startTimer(seconds=30){

clearTimer();

timer.max=seconds;
timer.current=seconds;

updateTimerUI();

timer.interval=setInterval(()=>{

timer.current--;

updateTimerUI();

if(timer.current<=0){

clearTimer();

socket.emit("hostNext");

}

},1000);

}

function updateTimerUI(){

display.classList.remove(
"timer-green",
"timer-amber",
"timer-orange",
"timer-red",
"timer-dead"
);

let ratio=timer.current/timer.max;

if(ratio>.75)
display.classList.add("timer-green");
else if(ratio>.5)
display.classList.add("timer-amber");
else if(ratio>.25)
display.classList.add("timer-orange");
else if(ratio>0)
display.classList.add("timer-red");
else
display.classList.add("timer-dead");

}
// WINNER BINGO CELEBRATION

function showBingoCelebOverlay(){

if(document.querySelector(".bingo-overlay")){
return;
}


const overlay=document.createElement("div");

overlay.className="bingo-overlay";


overlay.innerHTML=`

<div class="bingo-title">
B I N G O !
</div>

<div class="bingo-sub">
WIN CONFIRMED
</div>

`;

document.body.appendChild(overlay);



const colors=[
"#FFD84D",
"#2ecc71",
"#3498db",
"#e74c3c",
"#9b59b6",
"#f1c40f",
"#e67e22"
];



for(let i=0;i<250;i++){

const flake=document.createElement("div");

flake.className="confetti-flake";


const size=Math.random()*14+6;

flake.style.width=size+"px";
flake.style.height=size+"px";

flake.style.background=
colors[
Math.floor(Math.random()*colors.length)
];


flake.style.left=
Math.random()*100+"vw";


const duration=
5+Math.random()*5;


flake.style.animation=
`confettiFall ${duration}s linear forwards`;



if(Math.random()>.5){

flake.style.borderRadius="50%";

}


overlay.appendChild(flake);

}



if(window.audioEngine){

window.audioEngine.speak(
"Bingo! Winner confirmed.",
{
rate:.8,
force:true
}
);

}



setTimeout(()=>{

overlay.remove();

},10000);


}



// DIGITAL WIN

socket.on(
"winApproved",
()=>{

showBingoCelebOverlay();

});



// PHYSICAL WIN

socket.on(
"physicalWinApproved",
()=>{

showBingoCelebOverlay();

});



// AUDIO UNLOCK

document.addEventListener(
"click",
()=>{

if(window.audioEngine){

window.audioEngine.unlock();

}

},
{
once:true
});


</script>

</body>
