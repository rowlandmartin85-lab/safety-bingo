<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Safety Standdown Host</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(135deg, #111827, #1f2937);
            color: #ffffff;
        }

        .host-container {
            width: min(1200px, 94%);
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .title-area h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 46px);
            font-weight: 800;
        }

        .title-area p {
            margin: 8px 0 0;
            color: #cbd5e1;
            font-size: 16px;
        }

        .connection {
            padding: 10px 16px;
            border-radius: 999px;
            background: #7f1d1d;
            color: #fecaca;
            font-weight: 700;
            white-space: nowrap;
        }

        .connection.connected {
            background: #14532d;
            color: #bbf7d0;
        }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .setting {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
        }

        .setting label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        .question-card {
            background: #ffffff;
            color: #111827;
            border-radius: 18px;
            padding: 30px;
            min-height: 360px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
            margin-bottom: 20px;
        }

        .question-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 999px;
            background: #e5e7eb;
            color: #374151;
            font-size: 13px;
            font-weight: 800;
        }

        .badge.category {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge.difficulty {
            background: #fef3c7;
            color: #92400e;
        }

        .question-number {
            margin-left: auto;
            font-weight: 800;
            color: #64748b;
        }

        .question-label,
        .answer-label {
            margin-bottom: 8px;
            color: #64748b;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        #questionBox {
            min-height: 120px;
            font-size: clamp(28px, 4vw, 48px);
            line-height: 1.15;
            font-weight: 800;
            display: flex;
            align-items: center;
        }

        .answer-area {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        #answerBox {
            min-height: 45px;
            font-size: 24px;
            line-height: 1.35;
            font-weight: 700;
            color: #166534;
        }

        .answer-hidden {
            color: #94a3b8 !important;
        }

        .timer-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        #timerDisplay {
            min-width: 100px;
            text-align: center;
            padding: 12px 20px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            font-size: 32px;
            font-weight: 900;
        }

        .timer-label {
            color: #cbd5e1;
            font-weight: 700;
        }

        .button-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 15px 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: filter .15s ease;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-start {
            background: #16a34a;
            color: white;
        }

        .btn-next {
            background: #2563eb;
            color: white;
        }

        .btn-previous {
            background: #475569;
            color: white;
        }

        .btn-pause {
            background: #f59e0b;
            color: #111827;
        }

        .btn-repeat {
            background: #7c3aed;
            color: white;
        }

        .btn-reset {
            background: #dc2626;
            color: white;
        }

        .status-panel {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 10px;
            background: rgba(15, 23, 42, .7);
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .control-panel {
                grid-template-columns: repeat(2, 1fr);
            }

            .button-panel {
                grid-template-columns: repeat(2, 1fr);
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .question-number {
                margin-left: 0;
            }
        }

        @media (max-width: 520px) {
            .control-panel {
                grid-template-columns: 1fr;
            }

            .button-panel {
                grid-template-columns: 1fr;
            }

            .question-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="host-container">

    <header class="header">
        <div class="title-area">
            <h1>Safety Standdown Host</h1>
            <p>Trivia-based safety standdown game control</p>
        </div>

        <div id="connectionStatus" class="connection">
            Disconnected
        </div>
    </header>

    <section class="control-panel">

        <div class="setting">
            <label for="timerMode">Question Timer</label>
            <select id="timerMode">
                <option value="none">No Timer</option>
                <option value="15">15 Seconds</option>
                <option value="30" selected>30 Seconds</option>
                <option value="45">45 Seconds</option>
                <option value="60">60 Seconds</option>
                <option value="90">90 Seconds</option>
            </select>
        </div>

        <div class="setting">
            <label for="winLimit">Maximum Winners</label>
            <select id="winLimit">
                <option value="1" selected>1 Winner</option>
                <option value="2">2 Winners</option>
                <option value="3">3 Winners</option>
                <option value="4">4 Winners</option>
                <option value="5">5 Winners</option>
            </select>
        </div>

        <div class="setting">
            <label>Game Type</label>
            <div style="padding-top:11px;font-weight:800;color:#f8fafc;">
                Safety Trivia
            </div>
        </div>

        <div class="setting">
            <label>Calling Method</label>
            <div style="padding-top:11px;font-weight:800;color:#f8fafc;">
                Questions Only
            </div>
        </div>

    </section>

    <main class="question-card">

        <div class="question-meta">
            <span id="categoryBadge" class="badge category">
                Category
            </span>

            <span id="difficultyBadge" class="badge difficulty">
                Difficulty
            </span>

            <span id="questionNumber" class="question-number">
                Question —
            </span>
        </div>

        <div class="question-label">
            Safety Question
        </div>

        <div id="questionBox">
            Waiting for game...
        </div>

        <div class="answer-area">

            <div class="answer-label">
                Correct Answer
            </div>

            <div id="answerBox" class="answer-hidden">
                Answer will appear here.
            </div>

        </div>

    </main>

    <div class="timer-panel">
        <span class="timer-label">Time Remaining</span>
        <div id="timerDisplay">—</div>
    </div>

    <section class="button-panel">

        <button id="startBtn" class="btn-start">
            START GAME
        </button>

        <button id="previousBtn" class="btn-previous" style="display:none;">
            PREVIOUS
        </button>

        <button id="nextBtn" class="btn-next" style="display:none;">
            NEXT
        </button>

        <button id="pausePlayBtn" class="btn-pause" style="display:none;">
            PAUSE
        </button>

        <button id="repeatBtn" class="btn-repeat" style="display:none;">
            REPEAT QUESTION
        </button>

        <button id="resetBtn" class="btn-reset" style="display:none;">
            RESET GAME
        </button>

    </section>

    <div id="hostStatus" class="status-panel">
        Host is waiting for the game server.
    </div>

</div>

<!-- Socket.IO supplied by the server -->
<script src="/socket.io/socket.io.js"></script>

<!-- Shared host socket -->
<script src="/host.js"></script>

<!-- Trivia game host engine -->
<script src="/hostGame.js"></script>

<!-- Audio engine -->
<script src="/audio.js"></script>

</body>
</html>
