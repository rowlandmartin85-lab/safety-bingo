<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Bingo - Host Control</title>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Host CSS -->
    <link rel="stylesheet" href="/css/host.css">
    
    <style>
        /* Host Controls Button Layout */
        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px auto;
        }
        
        .controls-select-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }
        
        .controls-select-row select {
            flex: 1 1 200px;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
        }

        /* Button Group Common Styles */
        #activeControlsGroup,
        #checkerControlsGroup,
        #printerControlsGroup {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        /* Uniform Button Sizing */
        #activeControlsGroup button,
        #checkerControlsGroup button,
        #printerControlsGroup button {
            width: 200px;
            min-width: 200px;
            max-width: 200px;
            height: 52px;
            min-height: 52px;
            max-height: 52px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            margin: 0 !important;
            box-sizing: border-box;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 200px;
        }

        /* Audio Mute Button States */
        #audioMuteBtn {
            background: linear-gradient(145deg, #dc2626, #991b1b);
            color: #ffffff;
            border: 2px solid #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
        }

        #audioMuteBtn.audio-muted {
            background: linear-gradient(145deg, #16a34a, #166534);
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.35);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            #activeControlsGroup,
            #checkerControlsGroup,
            #printerControlsGroup {
                flex-direction: column;
                flex-wrap: nowrap;
                width: 100%;
            }

            #activeControlsGroup button,
            #checkerControlsGroup button,
            #printerControlsGroup button {
                width: 100%;
                min-width: 100%;
                max-width: 100%;
                height: 52px;
                min-height: 52px;
                max-height: 52px;
                flex: 0 0 52px;
            }
        }
    </style>
</head>
<body>

    <!-- Home Button -->
    <button id="homeBtn" type="button">HOME</button>

    <!-- Host Main Container -->
    <div class="host-container">
        <h1>HOST CONTROL</h1>

        <!-- Game Display -->
        <div id="questionBox" class="neon-green">
            Waiting for game...
        </div>
        <div id="answerBox"></div>

        <!-- Game Controls -->
        <section class="game-controls">
            <div class="controls-select-row">
                <select id="timerMode">
                    <option value="none" selected>No Timer</option>
                    <option value="15">15 Seconds</option>
                    <option value="30">30 Seconds</option>
                    <option value="45">45 Seconds</option>
                    <option value="60">60 Seconds</option>
                </select>

                <select id="winLimitMode">
                    <option value="1">Stop at 1 Winner</option>
                    <option value="2">Stop at 2 Winners</option>
                    <option value="3">Stop at 3 Winners</option>
                    <option value="5">Stop at 5 Winners</option>
                    <option value="10">Stop at 10 Winners</option>
                    <option value="100">Up to 100 Winners</option>
                </select>
            </div>

            <!-- Active Game Buttons -->
            <div id="activeControlsGroup">
                <button id="startBtn" type="button">START GAME</button>
                <button id="pausePlayBtn" type="button" style="display:none;">PAUSE</button>
                <button id="previousBtn" type="button" style="display:none;">PREVIOUS QUESTION</button>
                <button id="nextBtn" type="button" style="display:none;">NEXT QUESTION</button>
                <button id="repeatBtn" type="button" style="display:none;">REPEAT QUESTION</button>
                <button id="resetBtn" type="button" style="display:none;">RESET GAME</button>
                <button id="audioMuteBtn" type="button">MUTE AUDIO</button>
            </div>
        </section>

        <!-- Card Checker -->
        <section class="checker-panel">
            <h2>BINGO CARD CHECKER</h2>
            <input id="checkerCardID" type="number" placeholder="Enter Card ID">
            
            <div id="checkerControlsGroup">
                <button id="checkCardBtn" type="button">CHECK CARD</button>
            </div>

            <h3 id="checkedCardNumber"></h3>
            <div id="cardCheckerDisplay"></div>
        </section>

        <!-- Card Printing -->
        <section class="printer-panel">
            <h2>AUTOMATED CARD PRINTER</h2>
            
            <div class="print-row">
                <label for="startID">Starting Card ID:</label>
                <input id="startID" type="number" value="1" min="1">
            </div>

            <div class="print-row">
                <label for="totalCards">Total Cards:</label>
                <input id="totalCards" type="number" value="1" min="1">
            </div>

            <div class="print-row">
                <label for="cardsPerPage">Cards Per Sheet:</label>
                <select id="cardsPerPage">
                    <option value="1" selected>1 Card</option>
                    <option value="2">2 Cards</option>
                    <option value="3">3 Cards</option>
                    <option value="4">4 Cards</option>
                </select>
            </div>

            <div id="printerControlsGroup">
                <button id="buildCardsBtn" type="button">COMPILE & PRINT</button>
                <button id="answerKeyBtn" type="button">HOST ANSWER KEY</button>
                <button id="cheatSheetBtn" type="button">QUESTION KEY</button>
                <button id="questionManagerBtn" type="button">QUESTION MANAGER</button>
            </div>

            <div id="printOutputZone"></div>
        </section>

        <!-- Win Audit -->
        <section id="winPanel">
            <h2>WIN REQUESTS</h2>
            <div id="auditWinnerList"></div>
        </section>

    </div>

    <!-- Audit Overlay -->
    <div id="auditOverlay" class="audit-overlay">
        <div class="audit-window">
            <h2 id="auditTitle">CARD AUDIT</h2>
            <div id="auditCardDisplay" class="player-audit-card"></div>
            <div class="audit-buttons">
                <button id="approvePhysicalWin" type="button">APPROVE WIN</button>
                <button id="rejectPhysicalWin" type="button">REJECT WIN</button>
            </div>
        </div>
    </div>

    <!-- Home Confirmation Modal -->
    <div id="homeModal" class="modal-overlay">
        <div class="modal-window">
            <h2>End Current Game?</h2>
            <p>Returning home will reset the current game.</p>
            <div class="modal-buttons">
                <button id="cancelHome" type="button">Stay Here</button>
                <button id="confirmHome" type="button">End Game</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Load Order -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/cardGenerator.js"></script>
    <script src="/js/hostModules/hostState.js"></script>
    <script src="/js/hostModules/hostUI.js"></script>
    <script src="/js/hostModules/hostGame.js"></script>
    <script src="/js/hostModules/hostChecker.js"></script>
    <script src="/js/hostModules/hostAudit.js"></script>
    <script src="/js/hostModules/hostPrinter.js"></script>
    <script src="/js/host.js"></script>
</body>
</html>
