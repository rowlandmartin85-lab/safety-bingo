<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>
Safety Bingo - Host Control
</title>

<!-- QRCode Generator Library for Printing Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link rel="stylesheet" href="/css/host.css">

<style>
/* =====================================================
   HOST CONTROLS BUTTON LAYOUT MATCHING INDEX PAGE
   ===================================================== */
.game-controls {
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 100%;
  max-width: 800px;
  margin: 0 auto 20px auto;
}

.controls-select-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
}

.controls-select-row select {
  flex: 1 1 200px;
  padding: 12px;
  font-size: 15px;
  border-radius: 6px;
}

/* Primary Button Group with standard index.html spacing */
#activeControlsGroup {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin-top: 10px;
}

#activeControlsGroup button {
  flex: 1 1 180px;
  min-height: 48px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 6px;
  margin: 0 !important; /* Overrides inline button margin collisions */
  box-sizing: border-box;
}

@media (max-width: 600px) {
  #activeControlsGroup button {
    flex: 1 1 100%; /* Stacks cleanly on smaller mobile views */
  }
}
</style>

</head>

<body>

<!-- ==========================
     HOME BUTTON
========================== -->

<button 
id="homeBtn"
type="button">

HOME

</button>

<!-- ==========================
     HOST MAIN CONTAINER
========================== -->

<div class="host-container">

<h1>
HOST CONTROL
</h1>

<!-- ==========================
     GAME DISPLAY
========================== -->

<div 
id="questionBox"
class="neon-green">

Waiting for game...

</div>

<div 
id="answerBox">

</div>

<!-- ==========================
     GAME CONTROLS
========================== -->

<section class="game-controls">

<div class="controls-select-row">
  <select id="timerMode">

  <option value="none" selected>
  No Timer
  </option>

  <option value="15">
  15 Seconds
  </option>

  <option value="30">
  30 Seconds
  </option>

  <option value="45">
  45 Seconds
  </option>

  <option value="60">
  60 Seconds
  </option>

  </select>

  <select id="winLimitMode">

  <option value="1">
  Stop at 1 Winner
  </option>

  <option value="2">
  Stop at 2 Winners
  </option>

  <option value="3">
  Stop at 3 Winners
  </option>

  <option value="5">
  Stop at 5 Winners
  </option>

  <option value="10">
  Stop at 10 Winners
  </option>

  <option value="100">
  Up to 100 Winners
  </option>

  </select>
</div>

<!-- Grouped Active Buttons Container for Matched Spacing -->
<div id="activeControlsGroup">

  <button 
  id="startBtn"
  type="button">

  START GAME

  </button>

  <button 
  id="nextBtn"
  type="button"
  style="display:none;">

  NEXT QUESTION

  </button>

  <button 
  id="previousBtn"
  type="button"
  style="display:none;">

  PREVIOUS QUESTION

  </button>

  <button 
  id="repeatBtn"
  type="button"
  style="display:none;">

  REPEAT QUESTION

  </button>

  <button 
  id="pausePlayBtn"
  type="button"
  style="display:none;">

  PAUSE

  </button>

  <button 
  id="resetBtn"
  type="button"
  style="display:none;">

  RESET GAME

  </button>

</div>

</section>

<!-- ==========================
     CARD CHECKER
========================== -->

<section class="checker-panel">

<h2>
BINGO CARD CHECKER
</h2>

<input
id="checkerCardID"
type="number"
placeholder="Enter Card ID">

<button
id="checkCardBtn"
type="button">

CHECK CARD

</button>

<h3 id="checkedCardNumber"></h3>

<div 
id="cardCheckerDisplay">

</div>

</section>

<!-- ==========================
     CARD PRINTING
========================== -->

<section class="printer-panel">

<h2>
AUTOMATED CARD PRINTER
</h2>

<div class="print-row">

<label>
Starting Card ID:
</label>

<input
id="startID"
type="number"
value="1"
min="1">

</div>

<div class="print-row">

<label>
Total Cards:
</label>

<input
id="totalCards"
type="number"
value="12"
min="1">

</div>

<div class="print-row">

<label>
Cards Per Sheet:
</label>

<select id="cardsPerPage">

<option value="1" selected>
1 Card
</option>

<option value="2">
2 Cards
</option>

<option value="3">
3 Cards
</option>

<option value="4">
4 Cards
</option>

</select>

</div>

<button
id="buildCardsBtn"
type="button">

COMPILE & PRINT

</button>

<button
id="answerKeyBtn"
type="button">

HOST ANSWER KEY

</button>

<button
id="cheatSheetBtn"
type="button">

QUESTION KEY

</button>

<button
id="questionManagerBtn"
type="button">

QUESTION MANAGER

</button>

<div 
id="printOutputZone">

</div>

</section>

<!-- ==========================
     WIN AUDIT
========================== -->
<section id="winPanel">

<h2>
WIN REQUESTS
</h2>

<div 
id="auditWinnerList">

</div>

</section>

<!-- ==========================
     SINGLE AUDIT OVERLAY
========================== -->

<div
id="auditOverlay"
class="audit-overlay">

<div class="audit-window">

<h2 id="auditTitle">

CARD AUDIT

</h2>

<div
id="auditCardDisplay"
class="player-audit-card">

</div>

<div class="audit-buttons">

<button
id="approvePhysicalWin"
type="button">

APPROVE WIN

</button>

<button
id="rejectPhysicalWin"
type="button">

REJECT WIN

</button>

</div>

</div>

</div>

<!-- ==========================
     HOME CONFIRMATION MODAL
========================== -->

<div
id="homeModal"
class="modal-overlay">

<div class="modal-window">

<h2>
End Current Game?
</h2>

<p>

Returning home will reset the current game.

</p>

<div class="modal-buttons">

<button
id="cancelHome"
type="button">

Stay Here

</button>

<button
id="confirmHome"
type="button">

End Game

</button>

</div>

</div>

</div>

<!-- ==========================
     JAVASCRIPT LOAD ORDER
========================== -->

<script src="/socket.io/socket.io.js"></script>

<script src="/js/cardGenerator.js"></script>

<script src="/js/hostModules/hostState.js"></script>

<script src="/js/hostModules/hostUI.js"></script>

<script src="/js/hostModules/hostGame.js"></script>

<script src="/js/hostModules/hostChecker.js"></script>

<script src="/js/hostModules/hostAudit.js"></script>

<script src="/js/hostModules/hostPrinter.js"></script>

<script src="/js/host.js"></script>

</body>

</html>
