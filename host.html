<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Safety Bingo - Host Control</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <link
        rel="stylesheet"
        href="/css/host.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
        }

        .host-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        #homeBtn {
            display: block;
            margin: 0 auto 20px auto;
        }

        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 25px auto;
        }

        .controls-select-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }

        .controls-select-row select {
            flex: 1 1 250px;
            min-height: 48px;
            padding: 10px 14px;
            font-size: 16px;
            border-radius: 8px;
        }

        #activeControlsGroup {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #activeControlsGroup button {
            width: 210px;
            min-width: 210px;
            max-width: 210px;
            height: 52px;
            min-height: 52px;
            padding: 10px 14px;
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 210px;
        }

        #connectionStatus {
            text-align: center;
            margin: 10px auto 20px auto;
            font-weight: bold;
            color: #facc15;
        }

        #questionBox {
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: bold;
        }

        #answerBox {
            min-height: 45px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checker-panel,
        .printer-panel,
        #winPanel {
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .checker-panel input,
        .printer-panel input,
        .printer-panel select {
            min-height: 45px;
            padding: 8px 12px;
            font-size: 16px;
        }

        .print-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .print-row label {
            min-width: 160px;
        }

        .print-row input,
        .print-row select {
            flex: 1 1 200px;
        }

        .checker-panel button,
        .printer-panel button {
            margin: 8px 5px;
        }

        #auditWinnerList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .winner-request {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border: 2px solid #facc15;
            border-radius: 10px;
        }

        .winner-request button {
            min-width: 130px;
            min-height: 42px;
        }

        .audit-overlay,
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.80);
            padding: 20px;
        }

        .audit-overlay.show,
        .modal-overlay.show {
            display: flex;
        }

        .audit-window,
        .modal-window {
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 15px;
            background: #111827;
            border: 2px solid #facc15;
            box-shadow: 0 20px 60px rgba(0,0,0,.6);
            color: white;
            text-align: center;
        }

        .audit-buttons,
        .modal-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .audit-buttons button,
        .modal-buttons button {
            min-width: 160px;
            min-height: 48px;
        }

        #approvePhysicalWin {
            background: #16a34a;
            color: white;
        }

        #rejectPhysicalWin {
            background: #dc2626;
            color: white;
        }

        #auditCardDisplay {
            margin-top: 20px;
            min-height: 100px;
        }

        .audit-card-info {
            padding: 20px;
            border: 2px solid #22c55e;
            border-radius: 12px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            #activeControlsGroup {
                flex-direction: column;
                flex-wrap: nowrap;
            }

            #activeControlsGroup button {
                width: 100%;
                min-width: 100%;
                max-width: 100%;
                flex: 0 0 52px;
            }

            #questionBox {
                font-size: 21px;
            }

            .print-row {
                flex-direction: column;
                align-items: stretch;
            }

            .print-row label {
                min-width: 0;
            }

        }

    </style>

</head>


<body>

    <button
        id="homeBtn"
        type="button"
    >
        HOME
    </button>


    <div class="host-container">

        <h1>
            HOST CONTROL
        </h1>


        <div id="connectionStatus">
            CONNECTING TO SERVER...
        </div>


        <!-- ==========================
             GAME DISPLAY
        ========================== -->

        <div
            id="questionBox"
            class="neon-green"
        >
            Waiting for game...
        </div>


        <div id="answerBox"></div>


        <!-- ==========================
             GAME CONTROLS
        ========================== -->

        <section class="game-controls">

            <div class="controls-select-row">

                <select id="timerMode">

                    <option
                        value="none"
                        selected
                    >
                        No Timer
                    </option>

                    <option value="15">
                        15 Seconds
                    </option>

                    <option value="30">
                        30 Seconds
                    </option>

                    <option value="45">
                        45 Seconds
                    </option>

                    <option value="60">
                        60 Seconds
                    </option>

                </select>


                <select id="winLimitMode">

                    <option value="1">
                        Stop at 1 Winner
                    </option>

                    <option value="2">
                        Stop at 2 Winners
                    </option>

                    <option value="3">
                        Stop at 3 Winners
                    </option>

                    <option value="5">
                        Stop at 5 Winners
                    </option>

                    <option value="10">
                        Stop at 10 Winners
                    </option>

                    <option value="100">
                        Up to 100 Winners
                    </option>

                </select>

            </div>


            <div id="activeControlsGroup">

                <button
                    id="startBtn"
                    type="button"
                >
                    START GAME
                </button>


                <button
                    id="pausePlayBtn"
                    type="button"
                    style="display:none;"
                >
                    PAUSE
                </button>


                <button
                    id="previousBtn"
                    type="button"
                    style="display:none;"
                >
                    PREVIOUS QUESTION
                </button>


                <button
                    id="nextBtn"
                    type="button"
                    style="display:none;"
                >
                    NEXT QUESTION
                </button>


                <button
                    id="repeatBtn"
                    type="button"
                    style="display:none;"
                >
                    REPEAT QUESTION
                </button>


                <button
                    id="resetBtn"
                    type="button"
                    style="display:none;"
                >
                    RESET GAME
                </button>

            </div>

        </section>


        <!-- ==========================
             CARD CHECKER
        ========================== -->

        <section class="checker-panel">

            <h2>
                BINGO CARD CHECKER
            </h2>


            <input
                id="checkerCardID"
                type="number"
                min="1"
                placeholder="Enter Card ID"
            >


            <button
                id="checkCardBtn"
                type="button"
            >
                CHECK CARD
            </button>


            <h3 id="checkedCardNumber"></h3>


            <div id="cardCheckerDisplay"></div>

        </section>


        <!-- ==========================
             CARD PRINTING
        ========================== -->

        <section class="printer-panel">

            <h2>
                AUTOMATED CARD PRINTER
            </h2>


            <div class="print-row">

                <label>
                    Starting Card ID:
                </label>

                <input
                    id="startID"
                    type="number"
                    value="1"
                    min="1"
                >

            </div>


            <div class="print-row">

                <label>
                    Total Cards:
                </label>

                <input
                    id="totalCards"
                    type="number"
                    value="1"
                    min="1"
                >

            </div>


            <div class="print-row">

                <label>
                    Cards Per Sheet:
                </label>

                <select id="cardsPerPage">

                    <option
                        value="1"
                        selected
                    >
                        1 Card
                    </option>

                    <option value="2">
                        2 Cards
                    </option>

                    <option value="3">
                        3 Cards
                    </option>

                    <option value="4">
                        4 Cards
                    </option>

                </select>

            </div>


            <button
                id="buildCardsBtn"
                type="button"
            >
                COMPILE & PRINT
            </button>


            <button
                id="answerKeyBtn"
                type="button"
            >
                HOST ANSWER KEY
            </button>


            <button
                id="cheatSheetBtn"
                type="button"
            >
                QUESTION KEY
            </button>


            <button
                id="questionManagerBtn"
                type="button"
            >
                QUESTION MANAGER
            </button>


            <div id="printOutputZone"></div>

        </section>


        <!-- ==========================
             WIN AUDIT
        ========================== -->

        <section id="winPanel">

            <h2>
                WIN REQUESTS
            </h2>

            <div id="auditWinnerList"></div>

        </section>


    </div>


    <!-- ==========================
         SINGLE AUDIT OVERLAY
    ========================== -->

    <div
        id="auditOverlay"
        class="audit-overlay"
    >

        <div class="audit-window">

            <h2 id="auditTitle">
                CARD AUDIT
            </h2>


            <div
                id="auditCardDisplay"
                class="player-audit-card"
            >
            </div>


            <div class="audit-buttons">

                <button
                    id="approvePhysicalWin"
                    type="button"
                >
                    APPROVE WIN
                </button>


                <button
                    id="rejectPhysicalWin"
                    type="button"
                >
                    REJECT WIN
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================
         HOME CONFIRMATION
    ========================== -->

    <div
        id="homeModal"
        class="modal-overlay"
    >

        <div class="modal-window">

            <h2>
                End Current Game?
            </h2>


            <p>
                Returning home will reset the current game.
            </p>


            <div class="modal-buttons">

                <button
                    id="cancelHome"
                    type="button"
                >
                    Stay Here
                </button>


                <button
                    id="confirmHome"
                    type="button"
                >
                    End Game
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================
         SOCKET.IO
    ========================== -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- ==========================
         OPTIONAL EXISTING MODULES
    ========================== -->

    <script src="/js/cardGenerator.js"></script>

    <script src="/js/hostChecker.js"></script>

    <script src="/js/hostPrinter.js"></script>


    <!-- ==========================
         MAIN HOST
    ========================== -->

    <script src="/js/host.js"></script>

</body>

</html>
